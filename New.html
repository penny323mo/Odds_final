<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>足球歷史賠率大數據</title>
<meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
    :root {
        --primary-brand: #3b82f6;
        --turf-green: #22c55e;
        --turf-green-dark: #15803d;
        --night-blue: #0f172a;
        --night-blue-light: #1e293b;
        --text-light: #f1f5f9;
        --glass-bg: rgba(255, 255, 255, 0.92);
        --glass-border: rgba(255, 255, 255, 0.4);
        --shadow-strong: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    body {
        margin: 0;
        /* 足球背景：深藍色 + 六角形球網紋理 */
        background-color: var(--night-blue);
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.2) 0%, transparent 20%),
            radial-gradient(circle at 90% 80%, rgba(34, 197, 94, 0.15) 0%, transparent 20%),
            url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l25.98 15v30L30 60 4.02 45V15z' fill-opacity='0.03' fill='%23ffffff' fill-rule='evenodd'/%3E%3C/svg%3E");
        font-family: 'Noto Sans TC', sans-serif;
        color: #334155;
        padding-bottom: 60px;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
    }

    /* 裝飾：戰術板圈圈 (背景裝飾) */
    .pitch-decoration {
        position: absolute;
        border: 2px solid rgba(255,255,255,0.05);
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
    }
    .pitch-circle-1 {
        width: 300px; height: 300px;
        top: -100px; left: -100px;
    }
    .pitch-circle-2 {
        width: 500px; height: 500px;
        bottom: -150px; right: -150px;
        border-color: rgba(34, 197, 94, 0.05);
    }

    /* ---------- Header: Scoreboard Style ---------- */
    .header {
        position: relative;
        background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(30,41,59,0.8) 100%);
        color: #fff;
        text-align: center;
        padding: 40px 20px 70px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        z-index: 2;
        overflow: hidden;
    }

    /* Header 入面嘅草地光影 */
    .header::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0; right: 0; height: 4px;
        background: linear-gradient(90deg, #22c55e, #3b82f6, #22c55e);
        box-shadow: 0 0 15px #22c55e;
    }

    .header h1 {
        font-family: 'Exo 2', sans-serif; /* 比較有運動感嘅字體 */
        margin: 0;
        font-size: 2.2rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        background: -webkit-linear-gradient(#fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: inline-block;
    }
    
    .header .icon-ball {
        font-size: 1.8rem;
        color: var(--turf-green);
        animation: bounce 2s infinite;
        display: inline-block;
        margin-right: 10px;
        vertical-align: middle;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }

    .header .desc {
        margin-top: 10px;
        font-size: 0.95rem;
        color: #94a3b8;
        font-weight: 300;
    }
    
    .timestamp {
        font-size: 0.75rem;
        color: #64748b;
        margin-top: 5px;
        font-family: monospace;
    }

    /* ---------- Tabs: Jersey Style ---------- */
    .nav-container {
        margin-top: -35px;
        padding: 0 15px;
        position: relative;
        z-index: 10;
    }

    .custom-tabs {
        background: var(--night-blue-light);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 6px;
        display: flex;
        box-shadow: var(--shadow-strong);
        max-width: 600px;
        margin: 0 auto;
    }

    .custom-tabs button {
        flex: 1;
        border: none;
        background: transparent;
        padding: 12px 0;
        border-radius: 12px;
        font-weight: 600;
        color: #94a3b8;
        transition: all 0.3s ease;
        font-size: 0.95rem;
        position: relative;
        overflow: hidden;
    }

    .custom-tabs button.active {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: #fff;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    /* ---------- Main Content: Glassmorphism ---------- */
    .tabcontent {
        max-width: 800px;
        margin: 24px auto;
        padding: 0 15px;
        position: relative;
        z-index: 5;
        animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Form Card 變成白色半透明，突出背景 */
    .form-card {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        margin-bottom: 24px;
    }

    fieldset {
        border: 1px solid #e2e8f0;
        background: rgba(248, 250, 252, 0.5);
        border-radius: 12px;
        padding: 16px;
        margin: 0 0 20px 0;
        position: relative;
    }
    
    legend {
        float: none;
        width: auto;
        padding: 0 10px;
        margin-left: -5px;
        margin-bottom: 10px;
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--night-blue);
        background: transparent;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    
    /* Input Styling */
    .input-row { margin-bottom: 12px; }
    .input-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #475569;
        margin-bottom: 4px;
        display: block;
        text-transform: uppercase;
    }

    .custom-input-group {
        display: flex;
        align-items: stretch;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
        transition: 0.2s;
    }
    .custom-input-group:focus-within {
        border-color: var(--primary-brand);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    .main-input {
        flex: 1; border: none; padding: 10px; font-size: 1rem; font-weight: 500; min-width: 0;
    }
    .main-input:focus { outline: none; }
    
    .divider-text {
        background: #f1f5f9; color: #94a3b8; padding: 0 10px; display: flex; align-items: center; font-size: 0.9rem; font-weight: bold;
    }
    
    .err-input {
        width: 60px; border: none; text-align: center; background: #f8fafc; font-size: 0.9rem; color: #64748b; border-left: 1px solid #e2e8f0;
    }
    .err-input:focus { outline: none; background: #fff; }

    .step-btns { display: flex; flex-direction: column; border-left: 1px solid #e2e8f0; }
    .step-btn {
        flex: 1; border: none; background: #f1f5f9; color: #64748b; padding: 0 8px; cursor: pointer; transition: 0.2s;
    }
    .step-btn:hover { background: #e2e8f0; color: var(--primary-brand); }
    .step-btn:first-child { border-bottom: 1px solid #e2e8f0; }

    select.form-select-custom {
        width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px; background-color: #fff; font-size: 1rem;
    }

    /* Buttons: Turf Green for Action */
    .btn-action {
        padding: 12px 36px;
        border-radius: 50px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transition: all 0.2s;
        border: none;
    }
    .btn-primary-turf {
        background: linear-gradient(135deg, var(--turf-green) 0%, var(--turf-green-dark) 100%);
        color: #fff;
        box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    }
    .btn-primary-turf:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5); color: #fff; }
    .btn-primary-turf:active { transform: translateY(0); }

    .btn-reset {
        background: #fff; color: #64748b; border: 1px solid #cbd5e1;
    }
    .btn-reset:hover { background: #f1f5f9; color: #334155; }

    /* ---------- Stats Dashboard ---------- */
    .stat-area { margin-top: 30px; }
    .stat-cards {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px;
    }
    .stat-card {
        background: #fff; padding: 16px 8px; border-radius: 16px; text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0;
        position: relative; overflow: hidden;
    }
    /* Add colored bar at bottom */
    .stat-card::after {
        content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    }
    .stat-card.win::after { background: #ef4444; }
    .stat-card.draw::after { background: #22c55e; }
    .stat-card.lose::after { background: #3b82f6; }

    .stat-card .label { font-size: 0.8rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
    .stat-card .value { font-size: 1.6rem; font-weight: 800; display: block; margin: 4px 0; color: #0f172a; }
    .stat-card .pct { font-size: 0.8rem; color: #94a3b8; font-family: monospace; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; display: inline-block;}

    .piebox {
        background: #fff; border-radius: 16px; padding: 24px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        border: 1px solid #e2e8f0;
    }
    .pie-legend { display: flex; gap: 15px; margin-top: 20px; font-size: 0.9rem; font-weight: 500; }
    .pie-legend div { display: flex; align-items: center; gap: 8px; }
    .pie-legend span { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,1), 0 0 0 3px #e2e8f0; }

    /* ---------- Table ---------- */
    .table-container {
        background: #fff; border-radius: 16px; overflow: hidden;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); margin-top: 24px;
        border: 1px solid #e2e8f0;
    }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; white-space: nowrap; }
    th {
        background: #f8fafc; padding: 14px 16px; font-weight: 700; text-align: center;
        color: #475569; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px;
        border-bottom: 2px solid #e2e8f0;
    }
    td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; text-align: center; color: #334155; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background: #fcfcfc; }
    
    /* Result Badges */
    .badge-result { padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; }
    .bg-win { background: #fee2e2; color: #ef4444; }
    .bg-draw { background: #dcfce7; color: #16a34a; }
    .bg-lose { background: #dbeafe; color: #2563eb; }

    /* ---------- Loading ---------- */
    #loadingOverlay {
        position: fixed; inset: 0;
        background: rgba(15, 23, 42, 0.9); /* Dark overlay */
        backdrop-filter: blur(5px);
        z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    }
    .loader-football {
        width: 48px; height: 48px;
        border: 5px solid #fff;
        border-bottom-color: var(--turf-green);
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
    }
    @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { color: #fff; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; font-size: 0.9rem; }

    /* ---------- Mobile Tweaks ---------- */
    @media (min-width: 768px) {
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        .piebox { flex-direction: row; gap: 40px; }
        .pie-legend { flex-direction: column; gap: 10px; margin-top: 0; }
        .header h1 { font-size: 3rem; }
    }
</style>
</head>
<body>

<!-- Background Decorations -->
<div class="pitch-decoration pitch-circle-1"></div>
<div class="pitch-decoration pitch-circle-2"></div>

<!-- Loading Overlay -->
<div aria-live="polite" id="loadingOverlay" role="alert">
    <span class="loader-football"></span>
    <span class="loading-text">載入比賽數據...</span>
</div>

<!-- Header -->
<div class="header">
    <h1><i class="bi bi-vinyl-fill icon-ball"></i> 足球歷史賠率</h1>
    <div class="desc">大數據分析：初盤、終盤賠率組合 (2013-2025)</div>
    <div class="timestamp" id="ts">Database Updated: 2025/08/01</div>
</div>

<!-- Tabs -->
<div class="nav-container">
    <div class="custom-tabs">
        <button class="active" id="tab1" onclick="showTab(0)">
            <i class="bi bi-trophy me-1"></i> 亞洲盤
        </button>
        <button id="tab2" onclick="showTab(1)">
            <i class="bi bi-circle-half me-1"></i> 大小球
        </button>
        <button id="tab3" onclick="showTab(2)">
            <i class="bi bi-globe-europe-africa me-1"></i> 歐洲盤
        </button>
    </div>
</div>

<!-- Tab Content 1: 亞洲盤 -->
<div class="tabcontent" id="tc1">
    <div class="form-card">
        <form id="ahForm">
            <fieldset>
                <legend><i class="bi bi-stopwatch"></i> 初盤 (Open)</legend>
                <div class="form-grid">
                    <div class="input-row full-width">
                        <label class="input-label">盤口 (Handicap)</label>
                        <select id="ahInitHand" class="form-select-custom"></select>
                    </div>
                    <div class="input-row">
                        <label class="input-label">主隊賠率 (Home)</label>
                        <div class="custom-input-group">
                            <input id="ahHomeExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ahHomeErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ahHomeErr',0.05)" type="button" class="step-btn"><i class="bi bi-caret-up-fill"></i></button>
                                <button onclick="stepErr('ahHomeErr',-0.05)" type="button" class="step-btn"><i class="bi bi-caret-down-fill"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="input-label">客隊賠率 (Away)</label>
                        <div class="custom-input-group">
                            <input id="ahAwayExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ahAwayErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ahAwayErr',0.05)" type="button" class="step-btn"><i class="bi bi-caret-up-fill"></i></button>
                                <button onclick="stepErr('ahAwayErr',-0.05)" type="button" class="step-btn"><i class="bi bi-caret-down-fill"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend><i class="bi bi-flag-fill"></i> 終盤 (Close)</legend>
                <div class="form-grid">
                    <div class="input-row full-width">
                        <label class="input-label">盤口 (Handicap)</label>
                        <select id="ahCloseHand" class="form-select-custom"></select>
                    </div>
                    <div class="input-row">
                        <label class="input-label">主隊賠率 (Home)</label>
                        <div class="custom-input-group">
                            <input id="ahCloseHomeExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ahCloseHomeErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ahCloseHomeErr',0.05)" type="button" class="step-btn"><i class="bi bi-caret-up-fill"></i></button>
                                <button onclick="stepErr('ahCloseHomeErr',-0.05)" type="button" class="step-btn"><i class="bi bi-caret-down-fill"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="input-label">客隊賠率 (Away)</label>
                        <div class="custom-input-group">
                            <input id="ahCloseAwayExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ahCloseAwayErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ahCloseAwayErr',0.05)" type="button" class="step-btn"><i class="bi bi-caret-up-fill"></i></button>
                                <button onclick="stepErr('ahCloseAwayErr',-0.05)" type="button" class="step-btn"><i class="bi bi-caret-down-fill"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <button class="btn btn-primary-turf btn-action" onclick="doAhSearch()" type="button"><i class="bi bi-search me-1"></i> 搜尋比賽</button>
                <button class="btn btn-reset btn-action" id="resetAhBtn" type="button"><i class="bi bi-arrow-counterclockwise me-1"></i> 重設</button>
            </div>
        </form>
    </div>

    <!-- Stats Result Area -->
    <div class="stat-area" id="ahStat"></div>

    <div class="text-center mt-4 mb-3">
        <button class="btn btn-outline-light text-dark bg-white" id="showAhListBtn" style="display: none; border-radius: 30px;" type="button">顯示比賽列表</button>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table id="ahTable" style="display:none;">
                <thead>
                <tr>
                    <th>賽季</th><th>比賽 (比分)</th>
                    <th>初盤<br><small>盤/主/客</small></th>
                    <th>終盤<br><small>盤/主/客</small></th>
                    <th>結果</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Tab Content 2: 大小球 -->
<div class="tabcontent" id="tc2" style="display:none">
    <div class="form-card">
        <form id="ouForm">
            <fieldset>
                <legend><i class="bi bi-stopwatch"></i> 初盤 (Open)</legend>
                <div class="form-grid">
                    <div class="input-row full-width">
                        <label class="input-label">盤口 (Line)</label>
                        <select id="ouInitLine" class="form-select-custom"></select>
                    </div>
                    <div class="input-row">
                        <label class="input-label">大球賠率 (Over)</label>
                        <div class="custom-input-group">
                            <input id="ouBigExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ouBigErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ouBigErr',0.05)" type="button" class="step-btn"><i class="bi bi-caret-up-fill"></i></button>
                                <button onclick="stepErr('ouBigErr',-0.05)" type="button" class="step-btn"><i class="bi bi-caret-down-fill"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="input-label">細球賠率 (Under)</label>
                        <div class="custom-input-group">
                            <input id="ouSmallExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ouSmallErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ouSmallErr',0.05)" type="button" class="step-btn"><i class="bi bi-caret-up-fill"></i></button>
                                <button onclick="stepErr('ouSmallErr',-0.05)" type="button" class="step-btn"><i class="bi bi-caret-down-fill"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend><i class="bi bi-flag-fill"></i> 終盤 (Close)</legend>
                <div class="form-grid">
                    <div class="input-row full-width">
                        <label class="input-label">盤口 (Line)</label>
                        <select id="ouCloseLine" class="form-select-custom"></select>
                    </div>
                    <div class="input-row">
                        <label class="input-label">大球賠率 (Over)</label>
                        <div class="custom-input-group">
                            <input id="ouBigExactC" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ouBigErrC" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ouBigErrC',0.05)" type="button" class="step-btn"><i class="bi bi-caret-up-fill"></i></button>
                                <button onclick="stepErr('ouBigErrC',-0.05)" type="button" class="step-btn"><i class="bi bi-caret-down-fill"></i></button>
                            </div>
                        </div>
                    </div>

<!-- Main Script Logic (保持原樣，確保邏輯不變) -->
<script>
    /* 1. 全局變數 */
    let AH = null, OU = null, EU = null;
    let lastAhResult = [], lastOuResult = [], lastEuResult = [];

    const DB = {
      asian:     { base: 'asian_handicap', subdir: '' },
      overUnder: { base: 'over_under',     subdir: '' },
      european:  { base: 'european_odds',  subdir: '' }
    };

    /* 2. 核心功能 */
    const overlay = document.getElementById('loadingOverlay');
    const __showLoading = () => { if(overlay) overlay.style.display = 'flex'; };
    const __hideLoading = () => { if(overlay) overlay.style.display = 'none'; };
    
    function showTab(i) {
      ["tab1", "tab2", "tab3"].forEach((id, idx) => {
        document.getElementById(id).classList.toggle("active", idx === i);
        const panel = document.getElementById("tc" + (idx + 1));
        if(idx === i) {
            panel.style.display = "block";
            panel.style.animation = 'none';
            panel.offsetHeight; 
            panel.style.animation = 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
        } else {
            panel.style.display = "none";
        }
      });
    }

    function stepErr(id, delta) {
      const el = document.getElementById(id);
      let v = parseFloat(el.value) || 0;
      v = Math.max(0, +(v + delta).toFixed(2));
      el.value = v.toFixed(2);
    }

    function range(exId, erId) {
      const ex = parseFloat(document.getElementById(exId).value),
            er = parseFloat(document.getElementById(erId).value) || 0;
      return isNaN(ex) ? [null, null] : [ex - er, ex + er];
    }
    
    function pct(n, t) {
      return t ? ((n / t * 100).toFixed(1) + '%') : '0.0%';
    }

    function drawPieChart(data) {
      const total = data.reduce((s, x) => s + x.val, 0);
      const sz = 160; 
      if (!total) return `<svg width="${sz}" height="${sz}"></svg>`;

      const r = sz / 2 - 10, cx = sz / 2, cy = sz / 2;
      const slices = data.filter(d => d.val > 0);

      if (slices.length === 1) {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="${slices[0].color}"></circle>
        </svg>`;
      }
      
      let currentAngle = -Math.PI / 2;
      const paths = slices.map(slice => {
        const sliceAngle = (slice.val / total) * 2 * Math.PI;
        const startAngle = currentAngle;
        const endAngle = currentAngle + sliceAngle;
        const x1 = cx + r * Math.cos(startAngle);
        const y1 = cy + r * Math.sin(startAngle);
        const x2 = cx + r * Math.cos(endAngle);
        const y2 = cy + r * Math.sin(endAngle);
        const largeArcFlag = sliceAngle > Math.PI ? 1 : 0;
        currentAngle = endAngle;
        return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArcFlag} 1 ${x2},${y2} Z" fill="${slice.color}" stroke="#fff" stroke-width="2"></path>`;
      }).join('');

      return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${paths}</svg>`;
    }
    
    function getEU(r, which) {
      const map = {
        open_home: ['EU_open_home_odds', '1X2_open_home_odds'],
        open_draw: ['EU_open_draw_odds', '1X2_open_draw_odds'],
        open_away: ['EU_open_away_odds', '1X2_open_away_odds'],
        close_home: ['EU_close_home_odds', '1X2_close_home_odds'],
        close_draw: ['EU_close_draw_odds', '1X2_close_draw_odds'],
        close_away: ['EU_close_away_odds', '1X2_close_away_odds'],
      };
      const keys = map[which] || [];
      for (const k of keys) { if (r[k] != null) return r[k]; }
      return null;
    }

    /* 3. 資料載入 */
    async function loadWithTrailingNumbers(base, { subdir = '', maxParts = 10 } = {}) {
      const prefix = subdir ? (subdir.replace(/\/$/, '') + '/') : '';
      const urls = [`${prefix}${base}.json`];
      for (let i = 1; i <= maxParts; i++) { urls.push(`${prefix}${base}${i}.json`); }

      const results = await Promise.allSettled(
        urls.map(u => fetch(u, { cache: 'no-store' }).then(r => r.ok ? r.json() : null))
      );
      const merged = [];
      for (const r of results) {
        if (r.status === 'fulfilled' && Array.isArray(r.value)) merged.push(...r.value);
      }
      return merged;
    }

    async function getAsianData(opts = {}) {
      if (!AH) AH = await loadWithTrailingNumbers(DB.asian.base, { subdir: DB.asian.subdir, ...opts });
      return AH;
    }
    async function getOverUnderData(opts = {}) {
      if (!OU) OU = await loadWithTrailingNumbers(DB.overUnder.base, { subdir: DB.overUnder.subdir, ...opts });
      return OU;
    }
    async function getEuropeanData(opts = {}) {
      if (!EU) EU = await loadWithTrailingNumbers(DB.european.base, { subdir: DB.european.subdir, ...opts });
      return EU;
    }

    /* 4. 搜尋與顯示 */
    function fillSelect(id, set) {
      const arr = Array.from(set).filter(v => v != null).sort((a, b) => a - b);
      document.getElementById(id).innerHTML =
        '<option value="">全部</option>' +
        arr.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function initAll() {
      if (!AH || !OU || !EU) {
        console.error("Data not loaded yet!");
        return;
      }
      fillSelect('ahInitHand', new Set(AH.map(r => r.AH_open_handicap)));
      fillSelect('ahCloseHand', new Set(AH.map(r => r.AH_close_handicap)));
      fillSelect('ouInitLine', new Set(OU.map(r => r.OU_line)));
      fillSelect('ouCloseLine', new Set(OU.map(r => r.close_OU_line)));
    }
    
    function generateStatsHTML(w, d, l, wColor, dColor, lColor, wLabel, dLabel, lLabel, tot, extraInfo = '') {
        return `
        <div class="stat-cards">
            <div class="stat-card win">
                <span class="label">${wLabel}</span>
                <span class="value">${w}</span>
                <span class="pct">${pct(w, tot)}</span>
            </div>
            <div class="stat-card draw">
                <span class="label">${dLabel}</span>
                <span class="value">${d}</span>
                <span class="pct">${pct(d, tot)}</span>
            </div>
            <div class="stat-card lose">
                <span class="label">${lLabel}</span>
                <span class="value">${l}</span>
                <span class="pct">${pct(l, tot)}</span>
            </div>
        </div>
        ${extraInfo ? `<div class="text-center mb-3" style="font-size:0.9rem; color:#64748b;">${extraInfo}</div>` : ''}
        <div class="piebox">
          ${drawPieChart([{ label: wLabel, val: w, color: wColor }, { label: dLabel, val: d, color: dColor }, { label: lLabel, val: l, color: lColor }])}
          <div class="pie-legend">
            <div><span style="background:${wColor}"></span>${wLabel}</div>
            <div><span style="background:${dColor}"></span>${dLabel}</div>
            <div><span style="background:${lColor}"></span>${lLabel}</div>
          </div>
        </div>`;
    }

    function doAhSearch() {
      const [hMin, hMax] = range('ahHomeExact', 'ahHomeErr'),
            [aMin, aMax] = range('ahAwayExact', 'ahAwayErr'),
            [hMinC, hMaxC] = range('ahCloseHomeExact', 'ahCloseHomeErr'),
            [aMinC, aMaxC] = range('ahCloseAwayExact', 'ahCloseAwayErr'),
            selO = document.getElementById('ahInitHand').value,
            selC = document.getElementById('ahCloseHand').value;

      lastAhResult = AH.filter(r => {
        if (selO && r.AH_open_handicap != +selO) return false;
        if (selC && r.AH_close_handicap != +selC) return false;
        if (hMin !== null && (r.AH_open_home_odds < hMin || r.AH_open_home_odds > hMax)) return false;
        if (aMin !== null && (r.AH_open_away_odds < aMin || r.AH_open_away_odds > aMax)) return false;
        if (hMinC !== null && (r.AH_close_home_odds < hMinC || r.AH_close_home_odds > hMaxC)) return false;
        if (aMinC !== null && (r.AH_close_away_odds < aMinC || r.AH_close_away_odds > aMaxC)) return false;
        return true;
      });

      let w = 0, d = 0, l = 0;
      lastAhResult.forEach(r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs + r.AH_close_handicap - as;
        if (diff > 0) w++; else if (diff < 0) l++; else d++;
      });

      const tot = lastAhResult.length;
      document.getElementById('ahStat').innerHTML = generateStatsHTML(
          w, d, l, '#ef4444', '#22c55e', '#3b82f6', '贏盤', '和盤', '輸盤', tot, `總場數：${tot}`
      );
      
      document.getElementById('ahTable').style.display = 'none';
      document.getElementById('showAhListBtn').style.display = tot > 0 ? 'inline-block' : 'none';
    }

    function doOuSearch() {
      const selO = document.getElementById('ouInitLine').value,
            selC = document.getElementById('ouCloseLine').value;
      const [bMin, bMax] = range('ouBigExact', 'ouBigErr'),
            [sMin, sMax] = range('ouSmallExact', 'ouSmallErr'),
            [bMinC, bMaxC] = range('ouBigExactC', 'ouBigErrC'),
            [sMinC, sMaxC] = range('ouSmallExactC', 'ouSmallErrC');

      lastOuResult = OU.filter(r => {
        if (selO && r.OU_line != +selO) return false;
        if (selC && r.close_OU_line != +selC) return false;
        if (bMin !== null && (r.OU_open_over_odds < bMin || r.OU_open_over_odds > bMax)) return false;
        if (sMin !== null && (r.OU_open_under_odds < sMin || r.OU_open_under_odds > sMax)) return false;
        if (bMinC !== null && (r.OU_close_over_odds < bMinC || r.OU_close_over_odds > bMaxC)) return false;
        if (sMinC !== null && (r.OU_close_under_odds < sMinC || r.OU_close_under_odds > sMaxC)) return false;
        return true;
      });

      let over = 0, push = 0, under = 0;
      lastOuResult.forEach(r => {
        const sum = r.ft_score.split('-').reduce((a, b) => +a + +b, 0);
        if (sum > r.close_OU_line) over++;
        else if (sum < r.close_OU_line) under++;
        else push++;
      });

      const tot = lastOuResult.length;
      document.getElementById('ouStat').innerHTML = generateStatsHTML(
          over, push, under, '#ef4444', '#22c55e', '#3b82f6', '大球', '走盤', '小球', tot, `總場數：${tot}`
      );
      
      document.getElementById('ouTable').style.display = 'none';
      document.getElementById('showOuListBtn').style.display = tot > 0 ? 'inline-block' : 'none';
    }

    function doEuSearch() {
      const [hMin, hMax] = range('euHomeExact', 'euHomeErr'),
            [dMin, dMax] = range('euDrawExact', 'euDrawErr'),
            [aMin, aMax] = range('euAwayExact', 'euAwayErr'),
            [hMinC, hMaxC] = range('euHomeExactC', 'euHomeErrC'),
            [dMinC, dMaxC] = range('euDrawExactC', 'euDrawErrC'),
            [aMinC, aMaxC] = range('euAwayExactC', 'euAwayErrC');

      lastEuResult = EU.filter(r => {
        const oH = getEU(r, 'open_home'); if (hMin !== null && (oH < hMin || oH > hMax)) return false;
        const oD = getEU(r, 'open_draw'); if (dMin !== null && (oD < dMin || oD > dMax)) return false;
        const oA = getEU(r, 'open_away'); if (aMin !== null && (oA < aMin || oA > aMax)) return false;
        const cH = getEU(r, 'close_home'); if (hMinC !== null && (cH < hMinC || cH > hMaxC)) return false;
        const cD = getEU(r, 'close_draw'); if (dMinC !== null && (cD < dMinC || cD > dMaxC)) return false;
        const cA = getEU(r, 'close_away'); if (aMinC !== null && (cA < aMinC || cA > aMaxC)) return false;
        return true;
      });

      let w = 0, d = 0, l = 0, d1 = 0, d2 = 0, d3 = 0;
      lastEuResult.forEach(r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs - as;
        if (diff > 0) {
          w++;
          if (diff === 1) d1++; else if (diff === 2) d2++; else d3++;
        } else if (diff < 0) {
          l++;
        } else {
          d++;
        }
      });

      const tot = lastEuResult.length;
      const extra = `總場數：${tot} <br> <small class="text-muted">主勝淨勝球 ➜ 1球:${d1} | 2球:${d2} | 3+球:${d3}</small>`;
      document.getElementById('euStat').innerHTML = generateStatsHTML(
          w, d, l, '#ef4444', '#22c55e', '#3b82f6', '主勝', '和局', '客勝', tot, extra
      );
        
      document.getElementById('euTable').style.display = 'none';
      document.getElementById('showEuListBtn').style.display = tot > 0 ? 'inline-block' : 'none';
    }

    /* 5. 渲染表格 */
    function confirmAndRender(resultArray, tableId, renderFn) {
      if (resultArray.length > 20000) {
        if (!confirm(`結果總共有 ${resultArray.length} 筆資料，全部顯示可能會導致頁面緩慢。確定要繼續嗎？`)) {
          return;
        }
      }
      const table = document.getElementById(tableId);
      const tbody = table.querySelector('tbody');
      tbody.innerHTML = '';
      resultArray.forEach(r => tbody.insertAdjacentHTML('beforeend', renderFn(r)));
      table.style.display = 'table';
      // Smooth scroll to table
      table.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.getElementById('showAhListBtn').addEventListener('click', () => {
      confirmAndRender(lastAhResult, 'ahTable', r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs + r.AH_close_handicap - as;
        const out = diff > 0 ? '<span class="badge-result bg-win">贏盤</span>' : diff < 0 ? '<span class="badge-result bg-lose">輸盤</span>' : '<span class="badge-result bg-draw">和盤</span>';
        return `<tr>
          <td>${r.season}</td>
          <td><b>${r.home_team}</b><br>vs<br><b>${r.away_team}</b><br>(${r.ft_score})</td>
          <td>${r.AH_open_handicap}<br><small class="text-secondary">${r.AH_open_home_odds}/${r.AH_open_away_odds}</small></td>
          <td>${r.AH_close_handicap}<br><small class="text-secondary">${r.AH_close_home_odds}/${r.AH_close_away_odds}</small></td>
          <td>${out}</td>
        </tr>`;
      });
    });

    document.getElementById('showOuListBtn').addEventListener('click', () => {
      confirmAndRender(lastOuResult, 'ouTable', r => {
        const sum = r.ft_score.split('-').reduce((a, b) => +a + +b, 0);
        const out = sum > r.close_OU_line ? '<span class="badge-result bg-win">大球</span>' : sum < r.close_OU_line ? '<span class="badge-result bg-lose">小球</span>' : '<span class="badge-result bg-draw">走盤</span>';
        return `<tr>
          <td>${r.season}</td>
          <td><b>${r.home_team}</b><br>vs<br><b>${r.away_team}</b><br>(${r.ft_score})</td>
          <td>${r.OU_line}<br><small class="text-secondary">${r.OU_open_over_odds}/${r.OU_open_under_odds}</small></td>
          <td>${r.close_OU_line}<br><small class="text-secondary">${r.OU_close_over_odds}/${r.OU_close_under_odds}</small></td>
          <td>${out}</td>
        </tr>`;
      });
    });

    document.getElementById('showEuListBtn').addEventListener('click', () => {
      confirmAndRender(lastEuResult, 'euTable', r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs - as;
        const out = diff > 0 ? '<span class="badge-result bg-win">主勝</span>' : diff < 0 ? '<span class="badge-result bg-lose">客勝</span>' : '<span class="badge-result bg-draw">和局</span>';
        return `<tr>
          <td>${r.season}</td>
          <td><b>${r.home_team}</b><br>vs<br><b>${r.away_team}</b><br>(${r.ft_score})</td>
          <td><small class="text-secondary">${getEU(r, 'open_home')}/${getEU(r, 'open_draw')}/${getEU(r, 'open_away')}</small></td>
          <td><small class="text-secondary">${getEU(r, 'close_home')}/${getEU(r, 'close_draw')}/${getEU(r, 'close_away')}</small></td>
          <td>${out}</td>
          <td>${diff > 0 ? '+'+diff : diff}</td>
        </tr>`;
      });
    });

    /* 重設按鈕 */
    document.getElementById('resetAhBtn').addEventListener('click', () => {
      document.getElementById('ahForm').reset();
      document.getElementById('ahStat').innerHTML = '';
      document.getElementById('showAhListBtn').style.display = 'none';
      document.getElementById('ahTable').style.display = 'none';
      lastAhResult = [];
    });
    document.getElementById('resetOuBtn').addEventListener('click', () => {
      document.getElementById('ouForm').reset();
      document.getElementById('ouStat').innerHTML = '';
      document.getElementById('showOuListBtn').style.display = 'none';
      document.getElementById('ouTable').style.display = 'none';
      lastOuResult = [];
    });
    document.getElementById('resetEuBtn').addEventListener('click', () => {
      document.getElementById('euForm').reset();
      document.getElementById('euStat').innerHTML = '';
      document.getElementById('showEuListBtn').style.display = 'none';
      document.getElementById('euTable').style.display = 'none';
      lastEuResult = [];
    });

    /* 6. 啟動 */
    (async function boot() {
      try {
        __showLoading();
        await Promise.all([
          getAsianData({ maxParts: 10 }),
          getOverUnderData({ maxParts: 10 }),
          getEuropeanData({ maxParts: 10 })
        ]);
        initAll();
      } catch (e) {
        console.error('資料載入失敗', e);
        alert('資料載入失敗，請稍後再試。');
      } finally {
        __hideLoading();
      }
    })();
</script>
</body>
</html>
