<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>足球歷史賠率篩選 Pro</title>
<meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport"/>
<!-- 引入 Google Fonts 令字體靚啲 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
    :root {
        --primary-color: #2563eb; /* 比較現代嘅藍色 */
        --primary-hover: #1d4ed8;
        --bg-color: #f1f5f9;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-radius: 12px;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
        margin: 0;
        background: var(--bg-color);
        font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
        color: var(--text-main);
        padding-bottom: 40px;
    }

    a { text-decoration:none; }

    /* ---------- Header ---------- */
    .header {
        background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
        color: #fff;
        text-align: center;
        padding: 40px 20px 60px; /* 預留空間俾 Tab bar */
        border-radius: 0 0 30px 30px;
        box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
        position: relative;
        z-index: 1;
    }
    .header h1 {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.5px;
    }
    .header .desc {
        margin-top: 8px;
        font-size: 0.95rem;
        opacity: 0.9;
        font-weight: 300;
    }
    .timestamp {
        font-size: 0.75rem;
        opacity: 0.7;
        margin-top: 4px;
    }

    /* ---------- Tabs Container ---------- */
    .nav-container {
        margin-top: -30px;
        padding: 0 15px;
        position: relative;
        z-index: 2;
    }

    .custom-tabs {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 6px;
        display: flex;
        box-shadow: var(--shadow);
        max-width: 600px;
        margin: 0 auto;
    }

    .custom-tabs button {
        flex: 1;
        border: none;
        background: transparent;
        padding: 12px 0;
        border-radius: 12px;
        font-weight: 500;
        color: var(--text-muted);
        transition: all 0.3s ease;
        font-size: 0.95rem;
    }

    .custom-tabs button.active {
        background: var(--primary-color);
        color: #fff;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
    
    .custom-tabs button:hover:not(.active) {
        background: #f1f5f9;
        color: var(--primary-color);
    }

    /* ---------- Main Content ---------- */
    .tabcontent {
        max-width: 800px;
        margin: 20px auto;
        padding: 0 15px;
        animation: fadeUp 0.4s ease-out;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Form Card ---------- */
    .form-card {
        background: var(--card-bg);
        border-radius: var(--border-radius);
        padding: 24px;
        box-shadow: var(--shadow);
        border: 1px solid #e2e8f0;
        margin-bottom: 24px;
    }

    fieldset {
        border: none;
        padding: 0;
        margin: 0 0 24px 0;
    }
    
    legend {
        float: none;
        width: 100%;
        padding: 0;
        margin-bottom: 16px;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--primary-color);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    legend::before {
        content: '';
        display: block;
        width: 4px;
        height: 18px;
        background: var(--primary-color);
        border-radius: 2px;
    }

    /* ---------- Input Styling ---------- */
    .input-row {
        margin-bottom: 16px;
    }
    
    .input-label {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-main);
        margin-bottom: 6px;
        display: block;
    }

    .custom-input-group {
        display: flex;
        align-items: stretch;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        overflow: hidden;
        transition: border-color 0.2s;
        background: #fff;
    }

    .custom-input-group:focus-within {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .main-input {
        flex: 1;
        border: none;
        padding: 10px 12px;
        font-size: 1rem;
        min-width: 0; /* Fix flex overflow */
    }
    .main-input:focus { outline: none; }

    .divider-text {
        background: #f8fafc;
        border-left: 1px solid #e2e8f0;
        border-right: 1px solid #e2e8f0;
        color: var(--text-muted);
        padding: 0 10px;
        display: flex;
        align-items: center;
        font-size: 0.85rem;
    }

    .err-input {
        width: 60px;
        border: none;
        text-align: center;
        background: #f8fafc;
        font-size: 0.9rem;
        color: var(--text-muted);
    }
    .err-input:focus { outline: none; background: #fff; }

    .step-btns {
        display: flex;
        flex-direction: column;
        border-left: 1px solid #e2e8f0;
    }

    .step-btn {
        flex: 1;
        border: none;
        background: #f1f5f9;
        color: var(--text-muted);
        padding: 0 8px;
        cursor: pointer;
        font-size: 10px;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .step-btn:hover { background: #e2e8f0; color: var(--primary-color); }
    .step-btn:first-child { border-bottom: 1px solid #e2e8f0; }

    select.form-select-custom {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background-color: #fff;
        font-size: 1rem;
    }

    /* ---------- Buttons ---------- */
    .btn-action {
        padding: 12px 30px;
        border-radius: 30px;
        font-weight: 600;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        transition: transform 0.2s;
    }
    .btn-action:active { transform: scale(0.96); }
    
    .btn-secondary-custom {
        background: #e2e8f0;
        color: var(--text-main);
        border: none;
    }

    /* ---------- Stats Dashboard ---------- */
    .stat-area {
        margin-top: 30px;
    }

    .stat-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 24px;
    }

    .stat-card {
        background: #fff;
        padding: 16px 10px;
        border-radius: 12px;
        text-align: center;
        box-shadow: var(--shadow);
        border-bottom: 4px solid transparent;
    }

    .stat-card.win { border-color: #ef4444; }
    .stat-card.draw { border-color: #22c55e; }
    .stat-card.lose { border-color: #3b82f6; }

    .stat-card .label { font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .stat-card .value { font-size: 1.4rem; font-weight: 800; display: block; line-height: 1; }
    .stat-card .pct { font-size: 0.8rem; opacity: 0.8; margin-top: 4px; display: block;}

    .stat-card.win .value { color: #ef4444; }
    .stat-card.draw .value { color: #22c55e; }
    .stat-card.lose .value { color: #3b82f6; }

    .piebox {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .pie-legend {
        display: flex;
        gap: 15px;
        margin-top: 15px;
        font-size: 0.9rem;
    }
    .pie-legend div { display: flex; align-items: center; gap: 6px; }
    .pie-legend span { width: 12px; height: 12px; border-radius: 4px; }

    /* ---------- Table ---------- */
    .table-container {
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow);
        margin-top: 24px;
        border: 1px solid #e2e8f0;
    }
    
    .table-responsive {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        white-space: nowrap;
    }

    th {
        background: #f8fafc;
        padding: 12px 16px;
        font-weight: 600;
        text-align: center;
        color: var(--text-muted);
        border-bottom: 2px solid #e2e8f0;
    }

    td {
        padding: 12px 16px;
        border-bottom: 1px solid #f1f5f9;
        text-align: center;
        color: var(--text-main);
    }

    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background: #fafbfc; }

    /* ---------- Loading ---------- */
    #loadingOverlay {
        position: fixed; inset: 0; 
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(4px);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
    }
    
    .spinner-border {
        width: 3rem; height: 3rem;
        color: var(--primary-color);
    }
    
    .loading-text {
        font-weight: 500;
        color: var(--primary-color);
        letter-spacing: 1px;
    }

    /* ---------- Mobile Tweaks ---------- */
    @media (min-width: 768px) {
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full-width { grid-column: span 2; }
        
        .piebox { flex-direction: row; gap: 40px; justify-content: center; }
        .pie-legend { flex-direction: column; gap: 8px; margin-top: 0; }
        
        .header h1 { font-size: 2.5rem; }
    }
</style>
</head>
<body>

<!-- Loading Overlay -->
<div aria-live="polite" id="loadingOverlay" role="alert">
    <div class="spinner-border" role="status"></div>
    <span class="loading-text">數據載入中...</span>
</div>

<!-- Header -->
<div class="header">
    <h1>足球歷史賠率篩選</h1>
    <div class="desc">大數據分析：初盤、終盤賠率組合 (2013-2025)</div>
    <div class="timestamp" id="ts">版本時間：2025/08/01</div>
</div>

<!-- Tabs -->
<div class="nav-container">
    <div class="custom-tabs">
        <button class="active" id="tab1" onclick="showTab(0)"><i class="bi bi-trophy-fill me-1"></i> 亞洲盤</button>
        <button id="tab2" onclick="showTab(1)"><i class="bi bi-circle-half me-1"></i> 大小球</button>
        <button id="tab3" onclick="showTab(2)"><i class="bi bi-globe me-1"></i> 歐洲盤</button>
    </div>
</div>

<!-- Tab Content 1: 亞洲盤 -->
<div class="tabcontent" id="tc1">
    <div class="form-card">
        <form id="ahForm">
            <fieldset>
                <legend><i class="bi bi-play-circle"></i> 初盤設定</legend>
                <div class="form-grid">
                    <div class="input-row full-width">
                        <label class="input-label">盤口</label>
                        <select id="ahInitHand" class="form-select-custom"></select>
                    </div>
                    <div class="input-row">
                        <label class="input-label">主隊賠率</label>
                        <div class="custom-input-group">
                            <input id="ahHomeExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ahHomeErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ahHomeErr',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('ahHomeErr',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="input-label">客隊賠率</label>
                        <div class="custom-input-group">
                            <input id="ahAwayExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ahAwayErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ahAwayErr',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('ahAwayErr',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend><i class="bi bi-stop-circle"></i> 終盤設定</legend>
                <div class="form-grid">
                    <div class="input-row full-width">
                        <label class="input-label">盤口</label>
                        <select id="ahCloseHand" class="form-select-custom"></select>
                    </div>
                    <div class="input-row">
                        <label class="input-label">主隊賠率</label>
                        <div class="custom-input-group">
                            <input id="ahCloseHomeExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ahCloseHomeErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ahCloseHomeErr',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('ahCloseHomeErr',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="input-label">客隊賠率</label>
                        <div class="custom-input-group">
                            <input id="ahCloseAwayExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ahCloseAwayErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ahCloseAwayErr',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('ahCloseAwayErr',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <button class="btn btn-primary btn-action" onclick="doAhSearch()" type="button"><i class="bi bi-search me-1"></i> 立即搜尋</button>
                <button class="btn btn-secondary-custom btn-action" id="resetAhBtn" type="button"><i class="bi bi-arrow-counterclockwise me-1"></i> 重設</button>
            </div>
        </form>
    </div>

    <!-- Stats Result Area -->
    <div class="stat-area" id="ahStat"></div>

    <div class="text-center mt-4 mb-3">
        <button class="btn btn-outline-primary" id="showAhListBtn" style="display: none;" type="button">顯示詳細比賽列表</button>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table id="ahTable" style="display:none;">
                <thead>
                <tr>
                    <th>賽季</th><th>比賽 (比分)</th>
                    <th>初盤<br><small>盤/主/客</small></th>
                    <th>終盤<br><small>盤/主/客</small></th>
                    <th>結果</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Tab Content 2: 大小球 -->
<div class="tabcontent" id="tc2" style="display:none">
    <div class="form-card">
        <form id="ouForm">
            <fieldset>

                <div class="form-grid">
                    <div class="input-row full-width">
                        <label class="input-label">盤口</label>
                        <select id="ouInitLine" class="form-select-custom"></select>
                    </div>
                    <div class="input-row">
                        <label class="input-label">大球賠率</label>

                            <input id="ouBigErr" class="err-input" step="0.01" type="number" value="0.05"/>

                                <button onclick="stepErr('ouBigErr',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="input-label">細球賠率</label>
                        <div class="custom-input-group">
                            <input id="ouSmallExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ouSmallErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ouSmallErr',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('ouSmallErr',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>

                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend><i class="bi bi-stop-circle"></i> 終盤設定</legend>

                    <div class="input-row full-width">
                        <label class="input-label">盤口</label>

                    </div>

                            <input id="ouBigExactC" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ouBigErrC" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ouBigErrC',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('ouBigErrC',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="input-label">細球賠率</label>
                        <div class="custom-input-group">
                            <input id="ouSmallExactC" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="ouSmallErrC" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('ouSmallErrC',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('ouSmallErrC',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <button class="btn btn-primary btn-action" onclick="doOuSearch()" type="button"><i class="bi bi-search me-1"></i> 立即搜尋</button>
                <button class="btn btn-secondary-custom btn-action" id="resetOuBtn" type="button"><i class="bi bi-arrow-counterclockwise me-1"></i> 重設</button>
            </div>
        </form>
    </div>

    <div class="stat-area" id="ouStat"></div>

    <div class="text-center mt-4 mb-3">
        <button class="btn btn-outline-primary" id="showOuListBtn" style="display: none;" type="button">顯示詳細比賽列表</button>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table id="ouTable" style="display:none;">
                <thead>
                <tr>
                    <th>賽季</th><th>比賽 (比分)</th>
                    <th>初盤<br><small>盤/大/細</small></th>
                    <th>終盤<br><small>盤/大/細</small></th>
                    <th>結果</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Tab Content 3: 歐洲盤 -->
<div class="tabcontent" id="tc3" style="display:none">
    <div class="form-card">
        <form id="euForm">
            <fieldset>
                <legend><i class="bi bi-play-circle"></i> 初盤設定</legend>
                <div class="form-grid">
                    <div class="input-row">
                        <label class="input-label">主勝賠率</label>
                        <div class="custom-input-group">
                            <input id="euHomeExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="euHomeErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('euHomeErr',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('euHomeErr',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="input-label">和局賠率</label>
                        <div class="custom-input-group">
                            <input id="euDrawExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="euDrawErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('euDrawErr',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('euDrawErr',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="input-label">客勝賠率</label>
                        <div class="custom-input-group">
                            <input id="euAwayExact" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="euAwayErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('euAwayErr',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('euAwayErr',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend><i class="bi bi-stop-circle"></i> 終盤設定</legend>
                <div class="form-grid">
                    <div class="input-row">
                        <label class="input-label">主勝賠率</label>
                        <div class="custom-input-group">
                            <input id="euHomeExactC" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="euHomeErrC" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('euHomeErrC',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('euHomeErrC',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="input-label">和局賠率</label>
                        <div class="custom-input-group">
                            <input id="euDrawExactC" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="euDrawErrC" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('euDrawErrC',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('euDrawErrC',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="input-label">客勝賠率</label>
                        <div class="custom-input-group">
                            <input id="euAwayExactC" class="main-input" placeholder="賠率" step="0.01" type="number"/>
                            <div class="divider-text">±</div>
                            <input id="euAwayErrC" class="err-input" step="0.01" type="number" value="0.05"/>
                            <div class="step-btns">
                                <button onclick="stepErr('euAwayErrC',0.05)" type="button" class="step-btn"><i class="bi bi-chevron-up"></i></button>
                                <button onclick="stepErr('euAwayErrC',-0.05)" type="button" class="step-btn"><i class="bi bi-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <button class="btn btn-primary btn-action" onclick="doEuSearch()" type="button"><i class="bi bi-search me-1"></i> 立即搜尋</button>
                <button class="btn btn-secondary-custom btn-action" id="resetEuBtn" type="button"><i class="bi bi-arrow-counterclockwise me-1"></i> 重設</button>
            </div>
        </form>
    </div>

    <div class="stat-area" id="euStat"></div>

    <div class="text-center mt-4 mb-3">
        <button class="btn btn-outline-primary" id="showEuListBtn" style="display: none;" type="button">顯示詳細比賽列表</button>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table id="euTable" style="display:none;">
                <thead>
                <tr>
                    <th>賽季</th><th>比賽 (比分)</th>
                    <th>初盤<br><small>主/和/客</small></th>
                    <th>終盤<br><small>主/和/客</small></th>
                    <th>結果</th>
                    <th>淨勝球</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Main Script Logic -->
<script>
    /***********************************************/
    /* 1. 全局變數與設定 (Global Variables & Config) */
    /***********************************************/
    let AH = null, OU = null, EU = null;
    let lastAhResult = [], lastOuResult = [], lastEuResult = [];

    const DB = {
      asian:     { base: 'asian_handicap', subdir: '' },
      overUnder: { base: 'over_under',     subdir: '' },
      european:  { base: 'european_odds',  subdir: '' }
    };

    /***********************************************/
    /* 2. 核心功能與輔助函數 (Core & Helper Functions) */
    /***********************************************/

    /* ===== Loading Overlay Control ===== */
    const overlay = document.getElementById('loadingOverlay');
    const __showLoading = () => { if(overlay) overlay.style.display = 'flex'; };
    const __hideLoading = () => { if(overlay) overlay.style.display = 'none'; };
    
    /* ===== Tabs UI ===== */
    function showTab(i) {
      ["tab1", "tab2", "tab3"].forEach((id, idx) => {
        document.getElementById(id).classList.toggle("active", idx === i);
        const panel = document.getElementById("tc" + (idx + 1));
        if(idx === i) {
            panel.style.display = "block";
            // Trigger animation reflow
            panel.style.animation = 'none';
            panel.offsetHeight; /* trigger reflow */
            panel.style.animation = 'fadeUp 0.4s ease-out';
        } else {
            panel.style.display = "none";
        }
      });
    }

    /* ===== Form & Input Helpers ===== */
    function stepErr(id, delta) {
      const el = document.getElementById(id);
      let v = parseFloat(el.value) || 0;
      v = Math.max(0, +(v + delta).toFixed(2));
      el.value = v.toFixed(2);
    }

    function range(exId, erId) {
      const ex = parseFloat(document.getElementById(exId).value),
            er = parseFloat(document.getElementById(erId).value) || 0;
      return isNaN(ex) ? [null, null] : [ex - er, ex + er];
    }
    
    /* ===== Data Display Helpers ===== */
    function pct(n, t) {
      return t ? ((n / t * 100).toFixed(1) + '%') : '0.0%';
    }

    /* ===== Pie Chart Drawer (Improved SVG) ===== */
    function drawPieChart(data) {
      const total = data.reduce((s, x) => s + x.val, 0);
      const sz = 160; 
      if (!total) return `<svg width="${sz}" height="${sz}"></svg>`;

      const r = sz / 2 - 10, cx = sz / 2, cy = sz / 2;
      const slices = data.filter(d => d.val > 0);

      // Single slice case
      if (slices.length === 1) {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="${slices[0].color}"></circle>
        </svg>`;
      }
      
      let currentAngle = -Math.PI / 2;
      const paths = slices.map(slice => {
        const sliceAngle = (slice.val / total) * 2 * Math.PI;
        const startAngle = currentAngle;
        const endAngle = currentAngle + sliceAngle;
        const x1 = cx + r * Math.cos(startAngle);
        const y1 = cy + r * Math.sin(startAngle);
        const x2 = cx + r * Math.cos(endAngle);
        const y2 = cy + r * Math.sin(endAngle);
        const largeArcFlag = sliceAngle > Math.PI ? 1 : 0;
        currentAngle = endAngle;
        return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArcFlag} 1 ${x2},${y2} Z" fill="${slice.color}" stroke="#fff" stroke-width="2"></path>`;
      }).join('');

      return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${paths}</svg>`;
    }
    
    /* ===== EU Odds Compatibility Helper ===== */
    function getEU(r, which) {
      const map = {
        open_home: ['EU_open_home_odds', '1X2_open_home_odds'],
        open_draw: ['EU_open_draw_odds', '1X2_open_draw_odds'],
        open_away: ['EU_open_away_odds', '1X2_open_away_odds'],
        close_home: ['EU_close_home_odds', '1X2_close_home_odds'],
        close_draw: ['EU_close_draw_odds', '1X2_close_draw_odds'],
        close_away: ['EU_close_away_odds', '1X2_close_away_odds'],
      };
      const keys = map[which] || [];
      for (const k of keys) { if (r[k] != null) return r[k]; }
      return null;
    }


    /***********************************************/
    /* 3. 資料載入邏輯 (Data Loading Logic)           */
    /***********************************************/

    async function loadWithTrailingNumbers(base, { subdir = '', maxParts = 10 } = {}) {
      const prefix = subdir ? (subdir.replace(/\/$/, '') + '/') : '';
      const urls = [`${prefix}${base}.json`];
      for (let i = 1; i <= maxParts; i++) { urls.push(`${prefix}${base}${i}.json`); }

      const results = await Promise.allSettled(
        urls.map(u => fetch(u, { cache: 'no-store' }).then(r => r.ok ? r.json() : null))
      );
      const merged = [];
      for (const r of results) {
        if (r.status === 'fulfilled' && Array.isArray(r.value)) merged.push(...r.value);
      }
      return merged;
    }

    async function getAsianData(opts = {}) {
      if (!AH) AH = await loadWithTrailingNumbers(DB.asian.base, { subdir: DB.asian.subdir, ...opts });
      return AH;
    }
    async function getOverUnderData(opts = {}) {
      if (!OU) OU = await loadWithTrailingNumbers(DB.overUnder.base, { subdir: DB.overUnder.subdir, ...opts });
      return OU;
    }
    async function getEuropeanData(opts = {}) {
      if (!EU) EU = await loadWithTrailingNumbers(DB.european.base, { subdir: DB.european.subdir, ...opts });
      return EU;
    }

    /***********************************************/
    /* 4. 初始化與搜尋邏輯 (Initialization & Search) */
    /***********************************************/

    function fillSelect(id, set) {
      const arr = Array.from(set).filter(v => v != null).sort((a, b) => a - b);
      document.getElementById(id).innerHTML =
        '<option value="">全部</option>' +
        arr.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function initAll() {
      if (!AH || !OU || !EU) {
        console.error("Data not loaded yet!");
        return;
      }
      fillSelect('ahInitHand', new Set(AH.map(r => r.AH_open_handicap)));
      fillSelect('ahCloseHand', new Set(AH.map(r => r.AH_close_handicap)));
      fillSelect('ouInitLine', new Set(OU.map(r => r.OU_line)));
      fillSelect('ouCloseLine', new Set(OU.map(r => r.close_OU_line)));
    }
    
    /* ===== Search Functions (Updated for Dashboard Look) ===== */
    function generateStatsHTML(w, d, l, wColor, dColor, lColor, wLabel, dLabel, lLabel, tot, extraInfo = '') {
        return `
        <div class="stat-cards">
            <div class="stat-card win">
                <span class="label">${wLabel}</span>
                <span class="value">${w}</span>
                <span class="pct">${pct(w, tot)}</span>
            </div>
            <div class="stat-card draw">
                <span class="label">${dLabel}</span>
                <span class="value">${d}</span>
                <span class="pct">${pct(d, tot)}</span>
            </div>
            <div class="stat-card lose">
                <span class="label">${lLabel}</span>
                <span class="value">${l}</span>
                <span class="pct">${pct(l, tot)}</span>
            </div>
        </div>
        ${extraInfo ? `<div class="text-center text-muted mb-3" style="font-size:0.9rem;">${extraInfo}</div>` : ''}
        <div class="piebox">
          ${drawPieChart([{ label: wLabel, val: w, color: wColor }, { label: dLabel, val: d, color: dColor }, { label: lLabel, val: l, color: lColor }])}
          <div class="pie-legend">
            <div><span style="background:${wColor}"></span>${wLabel}</div>
            <div><span style="background:${dColor}"></span>${dLabel}</div>
            <div><span style="background:${lColor}"></span>${lLabel}</div>
          </div>
        </div>`;
    }

    function doAhSearch() {
      const [hMin, hMax] = range('ahHomeExact', 'ahHomeErr'),
            [aMin, aMax] = range('ahAwayExact', 'ahAwayErr'),
            [hMinC, hMaxC] = range('ahCloseHomeExact', 'ahCloseHomeErr'),
            [aMinC, aMaxC] = range('ahCloseAwayExact', 'ahCloseAwayErr'),
            selO = document.getElementById('ahInitHand').value,
            selC = document.getElementById('ahCloseHand').value;

      lastAhResult = AH.filter(r => {
        if (selO && r.AH_open_handicap != +selO) return false;
        if (selC && r.AH_close_handicap != +selC) return false;
        if (hMin !== null && (r.AH_open_home_odds < hMin || r.AH_open_home_odds > hMax)) return false;
        if (aMin !== null && (r.AH_open_away_odds < aMin || r.AH_open_away_odds > aMax)) return false;
        if (hMinC !== null && (r.AH_close_home_odds < hMinC || r.AH_close_home_odds > hMaxC)) return false;
        if (aMinC !== null && (r.AH_close_away_odds < aMinC || r.AH_close_away_odds > aMaxC)) return false;
        return true;
      });

      let w = 0, d = 0, l = 0;
      lastAhResult.forEach(r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs + r.AH_close_handicap - as;
        if (diff > 0) w++; else if (diff < 0) l++; else d++;
      });

      const tot = lastAhResult.length;
      document.getElementById('ahStat').innerHTML = generateStatsHTML(
          w, d, l, '#ef4444', '#22c55e', '#3b82f6', '贏盤', '和盤', '輸盤', tot, `總場數：${tot}`
      );
      
      document.getElementById('ahTable').style.display = 'none';
      document.getElementById('showAhListBtn').style.display = tot > 0 ? 'inline-block' : 'none';
    }

    function doOuSearch() {
      const selO = document.getElementById('ouInitLine').value,
            selC = document.getElementById('ouCloseLine').value;
      const [bMin, bMax] = range('ouBigExact', 'ouBigErr'),
            [sMin, sMax] = range('ouSmallExact', 'ouSmallErr'),
            [bMinC, bMaxC] = range('ouBigExactC', 'ouBigErrC'),
            [sMinC, sMaxC] = range('ouSmallExactC', 'ouSmallErrC');

      lastOuResult = OU.filter(r => {
        if (selO && r.OU_line != +selO) return false;
        if (selC && r.close_OU_line != +selC) return false;
        if (bMin !== null && (r.OU_open_over_odds < bMin || r.OU_open_over_odds > bMax)) return false;
        if (sMin !== null && (r.OU_open_under_odds < sMin || r.OU_open_under_odds > sMax)) return false;
        if (bMinC !== null && (r.OU_close_over_odds < bMinC || r.OU_close_over_odds > bMaxC)) return false;
        if (sMinC !== null && (r.OU_close_under_odds < sMinC || r.OU_close_under_odds > sMaxC)) return false;
        return true;
      });

      let over = 0, push = 0, under = 0;
      lastOuResult.forEach(r => {
        const sum = r.ft_score.split('-').reduce((a, b) => +a + +b, 0);
        if (sum > r.close_OU_line) over++;
        else if (sum < r.close_OU_line) under++;
        else push++;
      });

      const tot = lastOuResult.length;
      document.getElementById('ouStat').innerHTML = generateStatsHTML(
          over, push, under, '#ef4444', '#22c55e', '#3b82f6', '大球', '走盤', '小球', tot, `總場數：${tot}`
      );
      
      document.getElementById('ouTable').style.display = 'none';
      document.getElementById('showOuListBtn').style.display = tot > 0 ? 'inline-block' : 'none';
    }

    function doEuSearch() {
      const [hMin, hMax] = range('euHomeExact', 'euHomeErr'),
            [dMin, dMax] = range('euDrawExact', 'euDrawErr'),
            [aMin, aMax] = range('euAwayExact', 'euAwayErr'),
            [hMinC, hMaxC] = range('euHomeExactC', 'euHomeErrC'),
            [dMinC, dMaxC] = range('euDrawExactC', 'euDrawErrC'),
            [aMinC, aMaxC] = range('euAwayExactC', 'euAwayErrC');

      lastEuResult = EU.filter(r => {
        const oH = getEU(r, 'open_home'); if (hMin !== null && (oH < hMin || oH > hMax)) return false;
        const oD = getEU(r, 'open_draw'); if (dMin !== null && (oD < dMin || oD > dMax)) return false;
        const oA = getEU(r, 'open_away'); if (aMin !== null && (oA < aMin || oA > aMax)) return false;
        const cH = getEU(r, 'close_home'); if (hMinC !== null && (cH < hMinC || cH > hMaxC)) return false;
        const cD = getEU(r, 'close_draw'); if (dMinC !== null && (cD < dMinC || cD > dMaxC)) return false;
        const cA = getEU(r, 'close_away'); if (aMinC !== null && (cA < aMinC || cA > aMaxC)) return false;
        return true;
      });

      let w = 0, d = 0, l = 0, d1 = 0, d2 = 0, d3 = 0;
      lastEuResult.forEach(r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs - as;
        if (diff > 0) {
          w++;
          if (diff === 1) d1++; else if (diff === 2) d2++; else d3++;
        } else if (diff < 0) {
          l++;
        } else {
          d++;
        }
      });

      const tot = lastEuResult.length;
      const extra = `總場數：${tot} <br> <small class="text-muted">主勝淨勝球 ➜ 1球:${d1} | 2球:${d2} | 3+球:${d3}</small>`;
      document.getElementById('euStat').innerHTML = generateStatsHTML(
          w, d, l, '#ef4444', '#22c55e', '#3b82f6', '主勝', '和局', '客勝', tot, extra
      );
        
      document.getElementById('euTable').style.display = 'none';
      document.getElementById('showEuListBtn').style.display = tot > 0 ? 'inline-block' : 'none';
    }

    /***********************************************/
    /* 5. 事件監聽 (Event Listeners)               */
    /***********************************************/
    
    function confirmAndRender(resultArray, tableId, renderFn) {
      if (resultArray.length > 20000) {
        if (!confirm(`結果總共有 ${resultArray.length} 筆資料，全部顯示可能會導致頁面緩慢。確定要繼續嗎？`)) {
          return;
        }
      }
      const table = document.getElementById(tableId);
      const tbody = table.querySelector('tbody');
      tbody.innerHTML = '';
      resultArray.forEach(r => tbody.insertAdjacentHTML('beforeend', renderFn(r)));
      table.style.display = 'table';
      table.scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('showAhListBtn').addEventListener('click', () => {
      confirmAndRender(lastAhResult, 'ahTable', r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs + r.AH_close_handicap - as;
        const out = diff > 0 ? '<span class="badge bg-danger">贏盤</span>' : diff < 0 ? '<span class="badge bg-primary">輸盤</span>' : '<span class="badge bg-success">和盤</span>';
        return `<tr>
          <td>${r.season}</td>
          <td><b>${r.home_team}</b><br>vs<br><b>${r.away_team}</b><br>(${r.ft_score})</td>
          <td>${r.AH_open_handicap}<br><small>${r.AH_open_home_odds}/${r.AH_open_away_odds}</small></td>
          <td>${r.AH_close_handicap}<br><small>${r.AH_close_home_odds}/${r.AH_close_away_odds}</small></td>
          <td>${out}</td>
        </tr>`;
      });
    });

    document.getElementById('showOuListBtn').addEventListener('click', () => {
      confirmAndRender(lastOuResult, 'ouTable', r => {
        const sum = r.ft_score.split('-').reduce((a, b) => +a + +b, 0);
        const out = sum > r.close_OU_line ? '<span class="badge bg-danger">大球</span>' : sum < r.close_OU_line ? '<span class="badge bg-primary">小球</span>' : '<span class="badge bg-success">走盤</span>';
        return `<tr>
          <td>${r.season}</td>
          <td><b>${r.home_team}</b><br>vs<br><b>${r.away_team}</b><br>(${r.ft_score})</td>
          <td>${r.OU_line}<br><small>${r.OU_open_over_odds}/${r.OU_open_under_odds}</small></td>
          <td>${r.close_OU_line}<br><small>${r.OU_close_over_odds}/${r.OU_close_under_odds}</small></td>
          <td>${out}</td>
        </tr>`;
      });
    });

    document.getElementById('showEuListBtn').addEventListener('click', () => {
      confirmAndRender(lastEuResult, 'euTable', r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs - as;
        const out = diff > 0 ? '<span class="badge bg-danger">主勝</span>' : diff < 0 ? '<span class="badge bg-primary">客勝</span>' : '<span class="badge bg-success">和局</span>';
        return `<tr>
          <td>${r.season}</td>
          <td><b>${r.home_team}</b><br>vs<br><b>${r.away_team}</b><br>(${r.ft_score})</td>
          <td><small>${getEU(r, 'open_home')}/${getEU(r, 'open_draw')}/${getEU(r, 'open_away')}</small></td>
          <td><small>${getEU(r, 'close_home')}/${getEU(r, 'close_draw')}/${getEU(r, 'close_away')}</small></td>
          <td>${out}</td>
          <td>${diff}</td>
        </tr>`;
      });
    });

    /* ===== Reset Button Listeners ===== */
    document.getElementById('resetAhBtn').addEventListener('click', () => {
      document.getElementById('ahForm').reset();
      document.getElementById('ahStat').innerHTML = '';
      document.getElementById('showAhListBtn').style.display = 'none';
      document.getElementById('ahTable').style.display = 'none';
      lastAhResult = [];
    });
    document.getElementById('resetOuBtn').addEventListener('click', () => {
      document.getElementById('ouForm').reset();
      document.getElementById('ouStat').innerHTML = '';
      document.getElementById('showOuListBtn').style.display = 'none';
      document.getElementById('ouTable').style.display = 'none';
      lastOuResult = [];
    });
    document.getElementById('resetEuBtn').addEventListener('click', () => {
      document.getElementById('euForm').reset();
      document.getElementById('euStat').innerHTML = '';
      document.getElementById('showEuListBtn').style.display = 'none';
      document.getElementById('euTable').style.display = 'none';
      lastEuResult = [];
    });

    /***********************************************/
    /* 6. 啟動函數 (Boot Function)                  */
    /***********************************************/
    (async function boot() {
      try {
        __showLoading();
        await Promise.all([
          getAsianData({ maxParts: 10 }),
          getOverUnderData({ maxParts: 10 }),
          getEuropeanData({ maxParts: 10 })
        ]);
        initAll();
      } catch (e) {
        console.error('資料載入失敗', e);
        alert('資料載入失敗，請稍後再試。');
      } finally {
        __hideLoading();
      }
    })();
