<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>足球歷史賠率篩選 Pro</title>
<!-- PWA 設定 -->
<meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" name="viewport"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#064e3b">

<!-- 引入字體 -->
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
    /* =========================================
       1. 基礎設定 (Base)
       ========================================= */
    :root {
        --bg-dark: #064e3b; 
        --glass-bg: rgba(6, 78, 59, 0.75);
        --glass-border: rgba(255, 255, 255, 0.2);
        --brand-green: #10b981;
        --brand-green-light: #34d399;
        --text-main: #ffffff;
        --text-sub: #d1fae5;
    }

    body {
        margin: 0;
        font-family: 'Noto Sans TC', sans-serif;
        color: var(--text-main);
        background-color: var(--bg-dark);
        min-height: 100vh;
        padding-bottom: 80px;
        overflow-x: hidden;
        width: 100vw;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top);
        padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    *, *::before, *::after { box-sizing: border-box; }

    /* =========================================
       2. 背景特效 (Background)
       ========================================= */
    .bg-layer {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        background-color: #064e3b;
        background-image: 
            radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.15) 0%, rgba(2, 44, 34, 0.85) 85%),
            url("https://images.unsplash.com/photo-1529900748604-07564a03e7a6?q=80&w=2070&auto=format&fit=crop");
        background-size: cover; background-position: center; background-attachment: fixed;
    }

    .bg-texture {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px; opacity: 0.3; pointer-events: none;
    }

    /* =========================================
       3. 頂部導航 (Header) - 至尊版
       ========================================= */
    .header { position: relative; text-align: center; padding: 25px 10px 15px; z-index: 10; width: 100%; }
    
    .header h1 {
        font-family: 'Noto Sans TC', sans-serif; font-weight: 900;
        font-size: clamp(1.6rem, 5vw, 3rem);
        margin: 0; color: #fff;
        display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: nowrap;
        animation: glowBreathing 4s ease-in-out infinite alternate;
        text-shadow: 0 2px 15px rgba(0,0,0,0.6);
        letter-spacing: 1px;
    }

    @keyframes glowBreathing {
        0% { text-shadow: 0 0 5px rgba(255,255,255,0.2), 0 0 10px rgba(16, 185, 129, 0.2); }
        100% { text-shadow: 0 0 25px rgba(255,255,255,0.6), 0 0 40px rgba(52, 211, 153, 0.5); }
    }

    /* 至尊足球 Logo Style */
    .football-logo {
        width: clamp(40px, 9vw, 65px);
        height: clamp(40px, 9vw, 65px);
        /* 加強陰影令佢立體啲 */
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        animation: slowSpin 15s linear infinite;
    }
    
    @keyframes slowSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .header .desc {
        margin-top: 8px; font-size: 0.85rem; color: #e0f2f1;
        background: rgba(0,0,0,0.3); padding: 4px 15px; border-radius: 50px;
        border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(4px);
        display: inline-block;
        font-weight: 500;
    }

    .nav-container { margin-top: 10px; padding: 0 10px; position: relative; z-index: 20; width: 100%; margin-bottom: 15px; }
    .custom-tabs {
        background: rgba(6, 78, 59, 0.85); border: 1px solid rgba(255,255,255,0.2);
        border-radius: 50px; padding: 4px; display: flex; gap: 5px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px);
        max-width: 600px; margin: 0 auto;
    }
    .custom-tabs button {
        flex: 1; border: none; background: transparent; color: rgba(255,255,255,0.6);
        padding: 10px 0; font-weight: 700; font-size: 0.9rem; border-radius: 40px;
        transition: all 0.2s; white-space: nowrap; 
    }
    .custom-tabs button.active { background: #fff; color: #064e3b; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    /* =========================================
       4. 主容器與卡片 (iPhone Compact Fix)
       ========================================= */
    .tabcontent {
        width: 98%; max-width: 900px; margin: 0 auto; padding: 0; 
        animation: fadeUp 0.4s ease-out;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .unified-card {
        background: var(--glass-bg); border: 1px solid var(--glass-border);
        border-radius: 20px; padding: 15px;
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .form-flex-container { display: flex; flex-direction: column; gap: 10px; }

    fieldset {
        border: 1px solid rgba(255,255,255,0.1); background: rgba(0, 0, 0, 0.25);
        border-radius: 12px; padding: 12px 12px 8px 12px;
        margin: 0; flex: 1;
    }
    legend {
        color: var(--brand-green-light); font-weight: 700; font-size: 0.95rem;
        text-transform: uppercase; display: flex; align-items: center; gap: 6px;
        margin-bottom: 8px;
    }

    /* =========================================
       5. 輸入框 (Compact Mode)
       ========================================= */
    .input-row { margin-bottom: 8px; }
    
    .input-label {
        font-size: 0.8rem; color: #a7f3d0; font-weight: 600; margin-bottom: 3px; display: block;
    }
    
    .custom-input-group {
        display: flex; align-items: stretch; background: rgba(0, 20, 10, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px;
        width: 100%; height: 38px;
    }
    .custom-input-group:focus-within {
        border-color: var(--brand-green);
        box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.3);
    }
    .main-input {
        flex: 1 1 auto; background: transparent; border: none; color: #fff; 
        padding: 0 10px; font-size: 1rem; font-family: monospace; min-width: 0;
    }
    .main-input:focus { outline: none; }
    
    .divider-text {
        color: var(--brand-green-light); background: rgba(255,255,255,0.05); padding: 0 6px; 
        display: flex; align-items: center; font-weight: bold; font-size: 0.8rem;
        border-left: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1);
    }
    .err-input {
        width: 45px; background: rgba(255,255,255,0.05); border: none; color: #d1fae5; 
        text-align: center; font-size: 0.9rem;
    }
    .step-btns { width: 26px; border-left: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; }
    .step-btn {
        flex: 1; background: rgba(255,255,255,0.05); border: none; color: var(--brand-green-light); 
        padding: 0; font-size: 0.65rem;
    }
    .step-btn:first-child { border-bottom: 1px solid rgba(255,255,255,0.1); }
    
    select.form-select-custom {
        width: 100%; padding: 0 10px; height: 38px;
        background-color: rgba(2, 44, 34, 0.9); color: #fff; 
        border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
        font-size: 0.95rem;
    }

    /* iPad 橫排容器 (Default block for mobile, flex for desktop) */
    .odds-row-desktop { display: block; }

    /* =========================================
       6. 3D 按鈕
       ========================================= */
    .action-row { display: flex; gap: 10px; margin-top: 15px; }
    .btn-3d {
        position: relative; border: none; outline: none; color: white; font-weight: 700; font-size: 1rem; 
        padding: 12px; border-radius: 30px; cursor: pointer; flex: 1;
        transition: transform 0.1s; 
        display: flex; align-items: center; justify-content: center; gap: 6px;
        text-transform: uppercase; letter-spacing: 0.5px;
    }
    .btn-green {
        background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
        box-shadow: 0 4px 0 #047857;
    }
    .btn-green:active { transform: translateY(4px); box-shadow: none; }
    .btn-grey {
        background: linear-gradient(180deg, #9ca3af 0%, #4b5563 100%);
        box-shadow: 0 4px 0 #1f2937;
    }
    .btn-grey:active { transform: translateY(4px); box-shadow: none; }

    /* =========================================
       7. 結果與圖表
       ========================================= */
    .results-section {
        margin-top: 20px; padding-top: 20px; border-top: 1px dashed rgba(255,255,255,0.2);
        display: none;
    }
    .stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .stat-card {
        background: rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 4px; text-align: center;
    }
    .stat-card.win { border-bottom: 3px solid #ef4444; } .stat-card.draw { border-bottom: 3px solid #22c55e; } .stat-card.lose { border-bottom: 3px solid #3b82f6; }
    .stat-card .value { font-size: 1.4rem; font-weight: 900; color: #fff; margin: 4px 0; }
    
    .piebox {
        background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: 100%; min-height: 250px;
    }
    .pie-legend { display: flex; gap: 12px; margin-top: 15px; font-size: 0.9rem; color: #fff; flex-wrap: wrap; justify-content: center; }

    /* =========================================
       8. 列表與複選篩選 (修復確認鍵)
       ========================================= */
    .list-section { margin-top: 25px; display: none; }
    .list-controls { margin-bottom: 12px; position: relative; }
    
    .multi-select-btn {
        width: 100%; padding: 12px; border-radius: 10px;
        background: rgba(0,0,0,0.4); color: #fff; 
        border: 1px solid rgba(255,255,255,0.3);
        text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        font-size: 0.95rem;
    }
    
    .multi-select-dropdown {
        display: none; position: absolute; top: 100%; left: 0; width: 100%;
        background: #022c22; border: 1px solid rgba(255,255,255,0.3);
        border-radius: 12px; margin-top: 5px; max-height: 350px; overflow-y: auto;
        z-index: 100; box-shadow: 0 15px 50px rgba(0,0,0,0.9);
    }
    .multi-select-dropdown.show { display: block; }
    
    /* 頂部全選/清空 */
    .multi-actions-top {
        padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);
        background: rgba(0,0,0,0.4); position: sticky; top: 0; z-index: 2;
    }
    /* 底部確認鍵 */
    .multi-actions-bottom {
        padding: 10px; border-top: 1px solid rgba(255,255,255,0.1);
        background: #064e3b; position: sticky; bottom: 0; z-index: 2;
    }
    
    .btn-sm-action {
        flex: 1; padding: 8px; font-size: 0.9rem; border-radius: 8px; border: none; cursor: pointer; font-weight: bold;
    }
    .btn-confirm {
        width: 100%; padding: 12px; background: #10b981; color: #fff; font-size: 1rem; border-radius: 8px; border: none; font-weight: bold;
        box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
    }
    .btn-confirm:active { background: #059669; transform: translateY(2px); }

    .multi-select-option {
        padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
        cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.95rem;
    }
    .multi-select-option input { transform: scale(1.3); accent-color: var(--brand-green); }
    
    .table-container { background: rgba(0, 0, 0, 0.2); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
    th { background: rgba(2, 44, 34, 0.95); padding: 12px 8px; color: #a7f3d0; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
    td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; color: #f1f5f9; }
    
    .badge-res { padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .bg-win { background: #ef4444; color: #fff; } .bg-draw { background: #22c55e; color: #fff; } .bg-lose { background: #3b82f6; color: #fff; }

    #loadingOverlay { position: fixed; inset: 0; background: #064e3b; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
    .spinner-ball { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #34d399; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* =========================================
       9. iPad/Desktop 寬屏適配
       ========================================= */
    @media (min-width: 768px) {
        .tabcontent { max-width: 960px; }
        .form-flex-container { display: flex; flex-direction: row; gap: 20px; }
        .odds-row-desktop { display: flex; flex-direction: row; gap: 15px; }
        .odds-row-desktop > .input-row { flex: 1; }
        
        .header h1 { font-size: 3rem; }
        .header { padding-bottom: 40px; }
        .nav-container { margin-top: -20px; }
        .unified-card { padding: 25px; }
        .custom-input-group, select.form-select-custom { height: 44px; }
        .input-label { font-size: 0.9rem; margin-bottom: 6px; }
        .input-row { margin-bottom: 15px; }
        .btn-3d { padding: 14px; font-size: 1.1rem; }
        table { font-size: 0.9rem; }
    }
</style>
</head>
<body>

<div class="bg-texture"></div>
<div class="bg-layer"></div>

<div aria-live="polite" id="loadingOverlay" role="alert">
    <div class="spinner-ball"></div>
    <div class="loading-text" style="color:#d1fae5; font-weight:bold; letter-spacing:1px;">資料載入中...</div>
</div>

<div class="header">
    <h1>
        <!-- 真．至尊足球 Logo (歐聯星紋幾何風格) -->
        <svg class="football-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#a7f3d0;stop-opacity:1" />
                </linearGradient>
            </defs>
            <!-- 外圈光暈 -->
            <circle cx="50" cy="50" r="46" stroke="url(#grad1)" stroke-width="2" fill="rgba(255,255,255,0.05)"/>
            <!-- 核心幾何 (Hexagon/Pentagon abstract) -->
            <path d="M50 5 L75 25 L65 55 L35 55 L25 25 Z" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M50 5 L50 30 M75 25 L88 45 M65 55 L75 80 M35 55 L25 80 M25 25 L12 45" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M50 30 L68 42 L62 62 L38 62 L32 42 Z" fill="white" fill-opacity="0.9"/>
            <circle cx="50" cy="50" r="4" fill="#064e3b"/>
        </svg>
        足球歷史賠率篩選
    </h1>
    <div class="desc">大數據分析 (2013-2025)</div>
    <!-- 時間戳已保留但隱藏 -->
    <div class="timestamp" id="ts" style="display:none">2025/08/01</div>
</div>

<div class="nav-container">
    <div class="custom-tabs">
        <button class="active" id="tab1" onclick="showTab(0)">亞洲盤</button>
        <button id="tab2" onclick="showTab(1)">大小球</button>
        <button id="tab3" onclick="showTab(2)">歐洲盤</button>
    </div>
</div>

<!-- ======================= Tab 1: 亞洲盤 ======================= -->
<div class="tabcontent" id="tc1">
    <div class="unified-card">
        <form id="ahForm" onsubmit="return false;">
            <div class="form-flex-container">
                <fieldset>
                    <legend><i class="bi bi-crosshair"></i> 初盤</legend>
                    <div class="input-row full-width">
                        <label class="input-label">盤口</label>
                        <select id="ahInitHand" class="form-select-custom"></select>
                    </div>
                    <div class="odds-row-desktop">
                        <div class="input-row">
                            <label class="input-label">主隊賠率</label>
                            <div class="custom-input-group">
                                <input id="ahHomeExact" class="main-input" placeholder="精確值" step="0.01" type="number"/>
                                <div class="divider-text">±</div>
                                <input id="ahHomeErr" class="err-input" step="0.01" type="number" value="0.05"/>
                                <div class="step-btns">
                                    <button onclick="stepErr('ahHomeErr',0.05)" type="button" class="step-btn"><i class="bi bi-caret-up-fill"></i></button>
                                    <button onclick="stepErr('ahHomeErr',-0.05)" type="button" class="step-btn"><i class="bi bi-caret-down-fill"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="input-row">
                            <label class="input-label">客隊賠率</label>
                            <div class="custom-input-group">
                                <input id="ahAwayExact" class="main-input" placeholder="精確值" step="0.01" type="number"/>
                                <div class="divider-text">±</div>
                                <input id="ahAwayErr" class="err-input" step="0.01" type="number" value="0.05"/>
                                <div class="step-btns">
                                    <button onclick="stepErr('ahAwayErr',0.05)" type="button" class="step-btn"><i class="bi bi-caret-up-fill"></i></button>
                                    <button onclick="stepErr('ahAwayErr',-0.05)" type="button" class="step-btn"><i class="bi bi-caret-down-fill"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend><i class="bi bi-flag-fill"></i> 終盤</legend>
                    <div class="input-row full-width">
                        <label class="input-label">盤口</label>
                        <select id="ahCloseHand" class="form-select-custom"></select>
                    </div>
                    <div class="odds-row-desktop">
                        <div class="input-row">
                            <label class="input-label">主隊賠率</label>
                            <div class="custom-input-group">
                                <input id="ahCloseHomeExact" class="main-input" placeholder="精確值" step="0.01" type="number"/>
                                <div class="divider-text">±</div>
                                <input id="ahCloseHomeErr" class="err-input" step="0.01" type="number" value="0.05"/>
                                <div class="step-btns">
                                    <button onclick="stepErr('ahCloseHomeErr',0.05)" type="button" class="step-btn"><i class="bi bi-caret-up-fill"></i></button>
                                    <button onclick="stepErr('ahCloseHomeErr',-0.05)" type="button" class="step-btn"><i class="bi bi-caret-down-fill"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="input-row">
                            <label class="input-label">客隊賠率</label>
                            <div class="custom-input-group">
                                <input id="ahCloseAwayExact" class="main-input" placeholder="精確值" step="0.01" type="number"/>
                                <div class="divider-text">±</div>
                                <input id="ahCloseAwayErr" class="err-input" step="0.01" type="number" value="0.05"/>
                                <div class="step-btns">
                                    <button onclick="stepErr('ahCloseAwayErr',0.05)" type="button" class="step-btn"><i class="bi bi-caret-up-fill"></i></button>
                                    <button onclick="stepErr('ahCloseAwayErr',-0.05)" type="button" class="step-btn"><i class="bi bi-caret-down-fill"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>

            <div class="action-row">
                <button class="btn-3d btn-green" onclick="doAhSearch()" type="button"><i class="bi bi-search"></i> 搜尋</button>
                <button class="btn-3d btn-grey" id="resetAhBtn" type="button"><i class="bi bi-arrow-counterclockwise"></i> 重設</button>
            </div>
        </form>

        <div id="ahResultSection" class="results-section">
            <div id="ahStat"></div>
            
            <button class="btn-3d btn-grey" onclick="toggleList('ah')" type="button" style="margin-top:15px; padding:10px; border-radius:15px;">
                <i class="bi bi-list-ul"></i> 顯示 / 隱藏 比賽列表
            </button>

            <div id="ahListSection" class="list-section">
                <!-- 賽季篩選 -->
                <div class="list-controls">
                    <label class="input-label" style="margin-bottom:5px;">📅 賽季篩選</label>
                    <div class="multi-select-container" style="position:relative;">
                        <div class="multi-select-btn" onclick="toggleSeasonDropdown('ah')" id="seasonBtn_ah">
                            選擇賽季 (已選: 全部)
                        </div>
                        <div class="multi-select-dropdown" id="seasonDropdown_ah">
                            <div class="multi-actions-top">
                                <button class="btn-sm-action" style="background:#0f766e;color:#fff" onclick="selectAllSeasons('ah', true)">全選</button>
                                <button class="btn-sm-action" style="background:#b91c1c;color:#fff" onclick="selectAllSeasons('ah', false)">清空</button>
                            </div>
                            <div id="seasonOptions_ah"></div>
                            <!-- 底部確認鍵: 綁定 applySeasonFilter -->
                            <div class="multi-actions-bottom">
                                <button class="btn-confirm" onclick="applySeasonFilter('ah')">確認並套用</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="table-container" id="ahTableContainer">
                    <div class="table-responsive">
                        <table id="ahTable" data-order="asc">

<script>
    /* 1. Global Vars */
    let AH = null, OU = null, EU = null;
    let currentTab = 'ah';
    let lastAhResult = [], lastOuResult = [], lastEuResult = [];
    let selectedSeasons = new Set(); // 複選集合

    const DB = {
      asian:     { base: 'asian_handicap', subdir: '' },
      overUnder: { base: 'over_under',     subdir: '' },
      european:  { base: 'european_odds',  subdir: '' }
    };

    /* 2. Core */
    const overlay = document.getElementById('loadingOverlay');
    const __showLoading = () => { if(overlay) overlay.style.display = 'flex'; };
    const __hideLoading = () => { if(overlay) overlay.style.display = 'none'; };
    
    function showTab(i) {
      ["tab1", "tab2", "tab3"].forEach((id, idx) => {
        document.getElementById(id).classList.toggle("active", idx === i);
        const panel = document.getElementById("tc" + (idx + 1));
        if(idx === i) {
            panel.style.display = "block";
            // Trigger animation reflow
            panel.style.animation = 'none';
            panel.offsetHeight; 
            panel.style.animation = 'fadeUp 0.4s ease-out';
            
            // Set current tab context
            if(i===0) currentTab='ah'; else if(i===1) currentTab='ou'; else currentTab='eu';
        } else {
            panel.style.display = "none";
        }
      });
    }

    function stepErr(id, delta) {
      const el = document.getElementById(id);
      let v = parseFloat(el.value) || 0;
      v = Math.max(0, +(v + delta).toFixed(2));
      el.value = v.toFixed(2);
    }

    function range(exId, erId) {
      const ex = parseFloat(document.getElementById(exId).value),
            er = parseFloat(document.getElementById(erId).value) || 0;
      return isNaN(ex) ? [null, null] : [ex - er, ex + er];
    }
    
    function pct(n, t) {
      return t ? ((n / t * 100).toFixed(1) + '%') : '0.0%';
    }

    /* Motion: Count Up Animation */
    function animateValue(obj, start, end, duration) {
        if (!obj) return; 
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start);
            if (progress < 1) {
                window.requestAnimationFrame(step);
            } else {
                obj.innerHTML = end; 
            }
        };
        window.requestAnimationFrame(step);
    }

    /* Motion: Render Stats with Animation */
    function generateStatsHTML(w, d, l, wColor, dColor, lColor, wLabel, dLabel, lLabel, tot, prefix, extraInfo = '') {
        const idWin = prefix + 'Win';
        const idDraw = prefix + 'Draw';
        const idLose = prefix + 'Lose';
        const idPie = prefix + 'Pie';
        
        const html = `
        <div class="stat-cards">
            <div class="stat-card win">
                <span class="label">${wLabel}</span>
                <span class="value" id="${idWin}">0</span>
                <span class="pct">${pct(w, tot)}</span>
            </div>
            <div class="stat-card draw">
                <span class="label">${dLabel}</span>
                <span class="value" id="${idDraw}">0</span>
                <span class="pct">${pct(d, tot)}</span>
            </div>
            <div class="stat-card lose">
                <span class="label">${lLabel}</span>
                <span class="value" id="${idLose}">0</span>
                <span class="pct">${pct(l, tot)}</span>
            </div>
        </div>
        ${extraInfo ? `<div class="text-center mb-3" style="font-size:0.85rem; color:#d1fae5;">${extraInfo}</div>` : ''}
        <div class="piebox" id="${idPie}">
          <!-- Pie chart will be injected here after delay -->
        </div>
        `;
        return html;
    }

    function triggerCountUp(w, d, l, prefix) {
        const idWin = prefix + 'Win';
        const idDraw = prefix + 'Draw';
        const idLose = prefix + 'Lose';
        setTimeout(() => {
            if(document.getElementById(idWin)) animateValue(document.getElementById(idWin), 0, w, 800);
            if(document.getElementById(idDraw)) animateValue(document.getElementById(idDraw), 0, d, 800);
            if(document.getElementById(idLose)) animateValue(document.getElementById(idLose), 0, l, 800);
        }, 100);
    }

    function renderPieWithDelay(w, d, l, wColor, dColor, lColor, wLabel, dLabel, lLabel, prefix) {
        const idPie = prefix + 'Pie';
        const pieContainer = document.getElementById(idPie);
        if(!pieContainer) return;
        
        // Wait 500ms
        setTimeout(() => {
            pieContainer.innerHTML = `
              ${drawPieChart([{ label: wLabel, val: w, color: wColor }, { label: dLabel, val: d, color: dColor }, { label: lLabel, val: l, color: lColor }])}
              <div class="pie-legend">
                <div><span style="background:${wColor};width:10px;height:10px;display:inline-block;border-radius:50%;margin-right:4px;"></span>${wLabel}</div>
                <div><span style="background:${dColor};width:10px;height:10px;display:inline-block;border-radius:50%;margin-right:4px;"></span>${dLabel}</div>
                <div><span style="background:${lColor};width:10px;height:10px;display:inline-block;border-radius:50%;margin-right:4px;"></span>${lLabel}</div>
              </div>
            `;
            const paths = pieContainer.querySelectorAll('.pie-chart-circle');
            setTimeout(() => {
                paths.forEach(p => p.classList.add('show'));
            }, 50);
        }, 500);
    }

    function drawPieChart(data) {
      const total = data.reduce((s, x) => s + x.val, 0);
      const sz = 200; // Smaller Size for mobile
      if (!total) return `<svg width="${sz}" height="${sz}"></svg>`;

      const r = sz / 2 - 10, cx = sz / 2, cy = sz / 2;
      const slices = data.filter(d => d.val > 0);

      if (slices.length === 1) {
        return `<div style="width:${sz}px; height:${sz}px; border-radius:50%; background:${slices[0].color};" class="pie-chart-circle"></div>`;
      }
      
      let gradientParts = [];
      let currentAngle = 0;
      
      data.forEach(slice => {
          if(slice.val > 0) {
              const angle = (slice.val / total) * 360;
              gradientParts.push(`${slice.color} ${currentAngle}deg ${currentAngle + angle}deg`);
              currentAngle += angle;
          }
      });
      
      const gradient = `conic-gradient(${gradientParts.join(', ')})`;
      return `<div class="pie-chart-circle" style="width:${sz}px; height:${sz}px; border-radius:50%; background:${gradient};"></div>`;
    }
    
    function getEU(r, which) {
      const map = {
        open_home: ['EU_open_home_odds', '1X2_open_home_odds'],
        open_draw: ['EU_open_draw_odds', '1X2_open_draw_odds'],
        open_away: ['EU_open_away_odds', '1X2_open_away_odds'],
        close_home: ['EU_close_home_odds', '1X2_close_home_odds'],
        close_draw: ['EU_close_draw_odds', '1X2_close_draw_odds'],
        close_away: ['EU_close_away_odds', '1X2_close_away_odds'],
      };
      const keys = map[which] || [];
      for (const k of keys) { if (r[k] != null) return r[k]; }
      return null;
    }

    async function loadWithTrailingNumbers(base, { subdir = '', maxParts = 10 } = {}) {
      const prefix = subdir ? (subdir.replace(/\/$/, '') + '/') : '';
      const urls = [`${prefix}${base}.json`];
      for (let i = 1; i <= maxParts; i++) { urls.push(`${prefix}${base}${i}.json`); }

      const results = await Promise.allSettled(
        urls.map(u => fetch(u, { cache: 'no-store' }).then(r => r.ok ? r.json() : null))
      );
      const merged = [];
      for (const r of results) {
        if (r.status === 'fulfilled' && Array.isArray(r.value)) merged.push(...r.value);
      }
      return merged;
    }

    async function getAsianData(opts = {}) {
      if (!AH) AH = await loadWithTrailingNumbers(DB.asian.base, { subdir: DB.asian.subdir, ...opts });
      return AH;
    }
    async function getOverUnderData(opts = {}) {
      if (!OU) OU = await loadWithTrailingNumbers(DB.overUnder.base, { subdir: DB.overUnder.subdir, ...opts });
      return OU;
    }
    async function getEuropeanData(opts = {}) {
      if (!EU) EU = await loadWithTrailingNumbers(DB.european.base, { subdir: DB.european.subdir, ...opts });
      return EU;
    }

    function fillSelect(id, set) {
      const arr = Array.from(set).filter(v => v != null).sort((a, b) => a - b);
      document.getElementById(id).innerHTML =
        '<option value="">--</option>' +
        arr.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function initAll() {
      if (!AH || !OU || !EU) {
        console.error("Data not loaded yet!");
        return;
      }
      fillSelect('ahInitHand', new Set(AH.map(r => r.AH_open_handicap)));
      fillSelect('ahCloseHand', new Set(AH.map(r => r.AH_close_handicap)));
      fillSelect('ouInitLine', new Set(OU.map(r => r.OU_line)));
      fillSelect('ouCloseLine', new Set(OU.map(r => r.close_OU_line)));
    }
    
    function resetAll() {
        ['ah', 'ou', 'eu'].forEach(type => {
            const form = document.getElementById(type + 'Form');
            if(form) form.reset();
            const stat = document.getElementById(type + 'ResultSection');
            if(stat) stat.style.display = 'none';
        });
        lastAhResult = []; lastOuResult = []; lastEuResult = [];
        selectedSeasons.clear(); 
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function doAhSearch() {
      const [hMin, hMax] = range('ahHomeExact', 'ahHomeErr'),
            [aMin, aMax] = range('ahAwayExact', 'ahAwayErr'),
            [hMinC, hMaxC] = range('ahCloseHomeExact', 'ahCloseHomeErr'),
            [aMinC, aMaxC] = range('ahCloseAwayExact', 'ahCloseAwayErr'),
            selO = document.getElementById('ahInitHand').value,
            selC = document.getElementById('ahCloseHand').value;

      lastAhResult = AH.filter(r => {
        if (selO && r.AH_open_handicap != +selO) return false;
        if (selC && r.AH_close_handicap != +selC) return false;
        if (hMin !== null && (r.AH_open_home_odds < hMin || r.AH_open_home_odds > hMax)) return false;
        if (aMin !== null && (r.AH_open_away_odds < aMin || r.AH_open_away_odds > aMax)) return false;
        if (hMinC !== null && (r.AH_close_home_odds < hMinC || r.AH_close_home_odds > hMaxC)) return false;
        if (aMinC !== null && (r.AH_close_away_odds < aMinC || r.AH_close_away_odds > aMaxC)) return false;
        return true;
      });

      let w = 0, d = 0, l = 0;
      lastAhResult.forEach(r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs + r.AH_close_handicap - as;
        if (diff > 0) w++; else if (diff < 0) l++; else d++;
      });

      const tot = lastAhResult.length;
      const resSec = document.getElementById('ahResultSection');
      
      document.getElementById('ahStat').innerHTML = generateStatsHTML(
          w, d, l, '#ef4444', '#22c55e', '#3b82f6', '贏盤', '和盤', '輸盤', tot, 'ah'
      );
      
      resSec.style.display = 'block';
      setTimeout(() => resSec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
      
      triggerCountUp(w, d, l, 'ah');
      renderPieWithDelay(w, d, l, '#ef4444', '#22c55e', '#3b82f6', '贏盤', '和盤', '輸盤', 'ah');
      
      document.getElementById('ahListSection').style.display = 'none';
      populateSeasons('ah', lastAhResult);
    }

    function doOuSearch() {
      const selO = document.getElementById('ouInitLine').value,
            selC = document.getElementById('ouCloseLine').value;
      const [bMin, bMax] = range('ouBigExact', 'ouBigErr'),
            [sMin, sMax] = range('ouSmallExact', 'ouSmallErr'),
            [bMinC, bMaxC] = range('ouBigExactC', 'ouBigErrC'),
            [sMinC, sMaxC] = range('ouSmallExactC', 'ouSmallErrC');

      lastOuResult = OU.filter(r => {
        if (selO && r.OU_line != +selO) return false;
        if (selC && r.close_OU_line != +selC) return false;
        if (bMin !== null && (r.OU_open_over_odds < bMin || r.OU_open_over_odds > bMax)) return false;
        if (sMin !== null && (r.OU_open_under_odds < sMin || r.OU_open_under_odds > sMax)) return false;
        if (bMinC !== null && (r.OU_close_over_odds < bMinC || r.OU_close_over_odds > bMaxC)) return false;
        if (sMinC !== null && (r.OU_close_under_odds < sMinC || r.OU_close_under_odds > sMaxC)) return false;
        return true;
      });

      let over = 0, push = 0, under = 0;
      lastOuResult.forEach(r => {
        const sum = r.ft_score.split('-').reduce((a, b) => +a + +b, 0);
        if (sum > r.close_OU_line) over++;
        else if (sum < r.close_OU_line) under++;
        else push++;
      });

      const tot = lastOuResult.length;
      const resSec = document.getElementById('ouResultSection');
      
      document.getElementById('ouStat').innerHTML = generateStatsHTML(
          over, push, under, '#ef4444', '#22c55e', '#3b82f6', '大球', '走盤', '小球', tot, 'ou'
      );
      
      resSec.style.display = 'block';
      setTimeout(() => resSec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);

      triggerCountUp(over, push, under, 'ou');
      renderPieWithDelay(over, push, under, '#ef4444', '#22c55e', '#3b82f6', '大球', '走盤', '小球', 'ou');
      
      document.getElementById('ouListSection').style.display = 'none';
      populateSeasons('ou', lastOuResult);
    }

    function doEuSearch() {
      const [hMin, hMax] = range('euHomeExact', 'euHomeErr'),
            [dMin, dMax] = range('euDrawExact', 'euDrawErr'),
            [aMin, aMax] = range('euAwayExact', 'euAwayErr'),
            [hMinC, hMaxC] = range('euHomeExactC', 'euHomeErrC'),
            [dMinC, dMaxC] = range('euDrawExactC', 'euDrawErrC'),
            [aMinC, aMaxC] = range('euAwayExactC', 'euAwayErrC');

      lastEuResult = EU.filter(r => {
        const oH = getEU(r, 'open_home'); if (hMin !== null && (oH < hMin || oH > hMax)) return false;
        const oD = getEU(r, 'open_draw'); if (dMin !== null && (oD < dMin || oD > dMax)) return false;
        const oA = getEU(r, 'open_away'); if (aMin !== null && (oA < aMin || oA > aMax)) return false;
        const cH = getEU(r, 'close_home'); if (hMinC !== null && (cH < hMinC || cH > hMaxC)) return false;
        const cD = getEU(r, 'close_draw'); if (dMinC !== null && (cD < dMinC || cD > dMaxC)) return false;
        const cA = getEU(r, 'close_away'); if (aMinC !== null && (cA < aMinC || cA > aMaxC)) return false;
        return true;
      });

      let w = 0, d = 0, l = 0, d1 = 0, d2 = 0, d3 = 0;
      lastEuResult.forEach(r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs - as;
        if (diff > 0) {
          w++;
          if (diff === 1) d1++; else if (diff === 2) d2++; else d3++;
        } else if (diff < 0) {
          l++;
        } else {
          d++;
        }
      });

      const tot = lastEuResult.length;
      const extra = `總場數：${tot} <br> <small style="color:#d1fae5">主勝淨勝球 ➜ 1球:${d1} | 2球:${d2} | 3+球:${d3}</small>`;
      const resSec = document.getElementById('euResultSection');
      
      document.getElementById('euStat').innerHTML = generateStatsHTML(
          w, d, l, '#ef4444', '#22c55e', '#3b82f6', '主勝', '和局', '客勝', tot, 'eu', extra
      );
      
      resSec.style.display = 'block';
      setTimeout(() => resSec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);

      triggerCountUp(w, d, l, 'eu');
      renderPieWithDelay(w, d, l, '#ef4444', '#22c55e', '#3b82f6', '主勝', '和局', '客勝', 'eu');
        
      document.getElementById('euListSection').style.display = 'none';
      populateSeasons('eu', lastEuResult);
    }

    /* === Multi-Select Season Logic (Apply Button Logic) === */
    function populateSeasons(type, data) {
        selectedSeasons.clear();
        
        const seasons = [...new Set(data.map(d => d.season))].sort().reverse();
        const optContainer = document.getElementById(`seasonOptions_${type}`);
        
        optContainer.innerHTML = seasons.map(s => `
            <div class="multi-select-option" onclick="toggleSeasonOption(this, '${s}', '${type}')">
                <input type="checkbox" value="${s}" checked> ${s}
            </div>
        `).join('');
        
        seasons.forEach(s => selectedSeasons.add(s));
        updateSeasonBtnText(type);
    }
    
    function toggleSeasonDropdown(type) {
        const dd = document.getElementById(`seasonDropdown_${type}`);
        dd.classList.toggle('show');
    }
    
    function toggleSeasonOption(div, season, type) {
        // Only updates internal state, DOES NOT render table
        const cb = div.querySelector('input');
        if (event.target !== cb) {
           cb.checked = !cb.checked;
        }
        
        if(cb.checked) selectedSeasons.add(season); 
        else selectedSeasons.delete(season);
        
        updateSeasonBtnText(type);
    }
    
    function selectAllSeasons(type, selectAll) {
        // Only updates internal state, DOES NOT render table
        const cbs = document.querySelectorAll(`#seasonOptions_${type} input`);
        cbs.forEach(cb => {
            cb.checked = selectAll;
            if(selectAll) selectedSeasons.add(cb.value); else selectedSeasons.delete(cb.value);
        });
        updateSeasonBtnText(type);
    }
    
    function updateSeasonBtnText(type) {
        const btn = document.getElementById(`seasonBtn_${type}`);
        const total = document.querySelectorAll(`#seasonOptions_${type} input`).length;
        const size = selectedSeasons.size;
        
        if(size === total) btn.innerText = "選擇賽季 (已選: 全部)";
        else if(size === 0) btn.innerText = "選擇賽季 (未選)";
        else btn.innerText = `選擇賽季 (已選 ${size} 個)`;
    }
    
    // NEW: The actual render trigger
    function applySeasonFilter(type) {
        const sourceData = type === 'ah' ? lastAhResult : (type === 'ou' ? lastOuResult : lastEuResult);
        const filtered = filterDataBySeasons(sourceData);
        confirmAndRender(filtered, type + 'Table', null, true);
        
        // Close dropdown
        toggleSeasonDropdown(type);
    }
    
    function filterDataBySeasons(data) {
        return data.filter(r => selectedSeasons.has(r.season));
    }

    /* === List & Table === */
    function toggleList(type) {
        const sec = document.getElementById(`${type}ListSection`);
        const tableContainer = document.getElementById(`${type}TableContainer`);
        
        if (sec.style.display === 'none') {
            sec.style.display = 'block';
            tableContainer.style.display = 'block';
            // Render initial view
            applySeasonFilter(type); 
            sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
            sec.style.display = 'none';
        }
    }

    function confirmAndRender(resultArray, tableId, renderFn, skipConfirm) {
      if (!skipConfirm && resultArray.length > 5000) {
        if (!confirm(`結果總共有 ${resultArray.length} 筆資料，全部顯示可能會導致頁面緩慢。確定要繼續嗎？`)) {
          return;
        }
      }
      
      const type = tableId.replace('Table', '');
      
      // Default render functions
      if(!renderFn) {
          if(type === 'ah') {
              renderFn = r => {
                const [hs, as] = r.ft_score.split('-').map(Number);
                const diff = hs + r.AH_close_handicap - as;
                const out = diff > 0 ? '<span class="badge-res bg-win">贏盤</span>' : diff < 0 ? '<span class="badge-res bg-lose">輸盤</span>' : '<span class="badge-res bg-draw">和盤</span>';
                return `<tr>
                  <td>${r.season}</td>
                  <td>${r.home_team} vs ${r.away_team}</td>
                  <td style="font-weight:bold;color:#fff;">${r.ft_score}</td>
                  <td>${r.AH_open_handicap}</td>
                  <td class="text-odds">${r.AH_open_home_odds}</td>
                  <td class="text-odds">${r.AH_open_away_odds}</td>
                  <td>${r.AH_close_handicap}</td>
                  <td class="text-odds">${r.AH_close_home_odds}</td>
                  <td class="text-odds">${r.AH_close_away_odds}</td>
                  <td>${out}</td>
                </tr>`;
              };
          } else if (type === 'ou') {
              renderFn = r => {
                const sum = r.ft_score.split('-').reduce((a, b) => +a + +b, 0);
                const out = sum > r.close_OU_line ? '<span class="badge-res bg-win">大球</span>' : sum < r.close_OU_line ? '<span class="badge-res bg-lose">小球</span>' : '<span class="badge-res bg-draw">走盤</span>';
                return `<tr>
                  <td>${r.season}</td>
                  <td>${r.home_team} vs ${r.away_team}</td>
                  <td style="font-weight:bold;color:#fff;">${r.ft_score}</td>
                  <td>${r.OU_line}</td>
                  <td class="text-odds">${r.OU_open_over_odds}</td>
                  <td class="text-odds">${r.OU_open_under_odds}</td>
                  <td>${r.close_OU_line}</td>
                  <td class="text-odds">${r.OU_close_over_odds}</td>
                  <td class="text-odds">${r.OU_close_under_odds}</td>
                  <td>${out}</td>
                </tr>`;
              };
          } else {
              renderFn = r => {
                const [hs, as] = r.ft_score.split('-').map(Number);
                const diff = hs - as;
                const out = diff > 0 ? '<span class="badge-res bg-win">主勝</span>' : diff < 0 ? '<span class="badge-res bg-lose">客勝</span>' : '<span class="badge-res bg-draw">和局</span>';
                return `<tr>
                  <td>${r.season}</td>
                  <td>${r.home_team} vs ${r.away_team}</td>
                  <td style="font-weight:bold;color:#fff;">${r.ft_score}</td>
                  <td><small style="color:#d1fae5">${getEU(r, 'open_home')}/${getEU(r, 'open_draw')}/${getEU(r, 'open_away')}</small></td>
                  <td><small style="color:#d1fae5">${getEU(r, 'close_home')}/${getEU(r, 'close_draw')}/${getEU(r, 'close_away')}</small></td>
                  <td>${out}</td>
                  <td>${diff > 0 ? '+'+diff : diff}</td>
                </tr>`;
              };
          }
      }

      const table = document.getElementById(tableId);
      const container = document.getElementById(type + 'TableContainer');
      const tbody = table.querySelector('tbody');
      
      tbody.innerHTML = '';
      const rowsHtml = resultArray.map(r => renderFn(r)).join('');
      tbody.innerHTML = rowsHtml;
      
      // Removed copyToClipboard event listener as requested

      table.style.display = 'table';
      container.style.display = 'block';
    }

    function sortTable(tableId, colIndex) {
        const table = document.getElementById(tableId);
        const tbody = table.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));
        const isAsc = table.getAttribute('data-order') === 'asc';
        
        rows.sort((a, b) => {
            const aText = a.children[colIndex].innerText.trim();
            const bText = b.children[colIndex].innerText.trim();
            const aNum = parseFloat(aText.replace(/[^0-9.-]+/g,""));
            const bNum = parseFloat(bText.replace(/[^0-9.-]+/g,""));
            if (!isNaN(aNum) && !isNaN(bNum)) return isAsc ? aNum - bNum : bNum - aNum;
            return isAsc ? aText.localeCompare(bText) : bText.localeCompare(aText);
        });
        
        table.setAttribute('data-order', isAsc ? 'desc' : 'asc');
        tbody.innerHTML = '';
        rows.forEach(tr => tbody.appendChild(tr));
    }

    ['resetAhBtn', 'resetOuBtn', 'resetEuBtn'].forEach(id => {
        document.getElementById(id).addEventListener('click', resetAll);
    });

    (async function boot() {
      try {
        __showLoading();
        await Promise.all([
          getAsianData({ maxParts: 10 }),
          getOverUnderData({ maxParts: 10 }),
          getEuropeanData({ maxParts: 10 })
        ]);
        initAll();
      } catch (e) {
        console.error('資料載入失敗', e);
        document.querySelector('.spinner-ball').style.display = 'none';
        document.querySelector('#loadingOverlay .loading-text').innerHTML = 
            `<span style="color:#ef4444">⚠️ 數據載入失敗<br><small style="font-size:0.8rem; opacity:0.8">請確保 .json 檔案在同一目錄<br>(${e.message})</small></span>`;
      } finally {
        __hideLoading();
      }
    })();
    
    // Close dropdown on outside click
    window.onclick = function(event) {
        if (!event.target.closest('.multi-select-container')) {
            const dds = document.getElementsByClassName("multi-select-dropdown");
            for (let i = 0; i < dds.length; i++) {
                if (dds[i].classList.contains('show')) {
                    dds[i].classList.remove('show');
                }
            }
        }
    }
</script>
