<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>足球歷史賠率篩選</title>

  <style>
    :root{
      color-scheme: light dark;
      --bg: Canvas;
      --fg: CanvasText;
      --muted: color-mix(in oklab, var(--fg) 55%, transparent);
      --card: color-mix(in oklab, var(--fg) 6%, transparent);
      --border: color-mix(in oklab, var(--fg) 14%, transparent);
      --shadow: 0 10px 30px rgba(0,0,0,.10);
      --r: 14px;
      --gap: 12px;
      --tap: 44px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --ui: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
    }

    body{ margin:0; font-family: var(--ui); background: var(--bg); color: var(--fg); }
    .wrap{ max-width: 1100px; margin: 0 auto; padding: 14px; }

    header{
      position: sticky; top: 0; z-index: 20;
      background: color-mix(in oklab, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .head{
      max-width: 1100px; margin: 0 auto;
      padding: 10px 14px;
      display:flex; gap: 12px; align-items: center; justify-content: space-between;
    }
    .title{ display:flex; flex-direction: column; gap: 2px; }
    h1{ margin:0; font-size: 18px; letter-spacing: .2px; }
    .sub{ font-size: 13px; color: var(--muted); }
    .ver{ font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

    .tabs{
      display:flex; gap: 8px; flex-wrap: wrap;
      margin: 12px 0 10px;
    }
    .tab{
      min-height: var(--tap);
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      font-size: 14px;
    }
    .tab[aria-selected="true"]{
      background: color-mix(in oklab, var(--fg) 10%, transparent);
      border-color: color-mix(in oklab, var(--fg) 24%, transparent);
      box-shadow: var(--shadow);
    }

    .panel{
      display:none;
      border-radius: var(--r);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel.active{ display:block; }

    .panel-head{
      padding: 12px 12px 10px;
      display:flex; align-items:center; justify-content: space-between; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .panel-head b{ font-size: 15px; }
    .actions{ display:flex; gap: 8px; flex-wrap: wrap; }
    .btn{
      min-height: var(--tap);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: color-mix(in oklab, var(--fg) 8%, transparent);
      color: var(--fg);
      cursor:pointer;
      font-size: 14px;
    }
    .btn.primary{
      background: color-mix(in oklab, var(--fg) 16%, transparent);
      border-color: color-mix(in oklab, var(--fg) 26%, transparent);
      font-weight: 600;
    }

    .grid{
      padding: 12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
    }
    @media (max-width: 820px){
      .grid{ grid-template-columns: 1fr; }
      .ver{ display:none; }
    }

    .card{
      border-radius: 12px;
      background: color-mix(in oklab, var(--bg) 60%, transparent);
      border: 1px solid var(--border);
      padding: 12px;
    }
    .card h3{
      margin: 0 0 10px;
      font-size: 14px;
      letter-spacing: .2px;
    }

    .fields{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: end;
    }
    @media (max-width: 520px){
      .fields{ grid-template-columns: 1fr; }
    }

    label{ display:flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    select, input{
      min-height: var(--tap);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 15px;
      outline: none;
    }
    input[type="number"]{ font-family: var(--mono); }

    .hint{
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      display:flex; align-items:center; justify-content: space-between; gap: 10px;
    }
    .status{ font-family: var(--mono); }

    .table-wrap{ padding: 12px; }
    .table-title{ margin: 0 0 8px; font-weight: 700; }
    .scroll{
      overflow:auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    table{ width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td{
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
    }
    th{ font-size: 12px; color: var(--muted); background: color-mix(in oklab, var(--fg) 5%, transparent); position: sticky; top: 0; }

    .toast{
      display:none;
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: color-mix(in oklab, #ff0000 10%, transparent);
      color: var(--fg);
      font-size: 13px;
    }
    .toast.show{ display:block; }
  </style>
</head>

<body>
<header>
  <div class="head">
    <div class="title">
      <h1>足球歷史賠率篩選</h1>
      <div class="sub">根據初盤、終盤所有條件組合快速篩選比賽（2013-2025）</div>
    </div>
    <div class="ver" id="verTime">版本時間：2025/08/01 上午 00:00:00 (GMT+8)</div>
  </div>
</header>

<div class="wrap">

  <div class="tabs" role="tablist" aria-label="查詢類型">
    <button class="tab" role="tab" aria-selected="true"  data-target="tab-ah">亞洲盤</button>
    <button class="tab" role="tab" aria-selected="false" data-target="tab-ou">大小球</button>
    <button class="tab" role="tab" aria-selected="false" data-target="tab-eu">歐洲盤</button>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 亞洲盤 -->
  <section class="panel active" id="tab-ah" role="tabpanel">
    <div class="panel-head">
      <b>亞洲盤查詢</b>
      <div class="actions">
        <button class="btn primary" id="ahSearch">搜尋</button>
        <button class="btn" id="ahReset">重設</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>初盤</h3>
        <div class="fields">
          <label>盤口
            <select id="ahOpenLine"></select>
          </label>
          <label>主隊賠率（最小）
            <input id="ahOpenHomeMin" type="number" step="0.01" inputmode="decimal" placeholder="例如 1.80">
          </label>
          <label>主隊賠率（最大）
            <input id="ahOpenHomeMax" type="number" step="0.01" inputmode="decimal" placeholder="例如 2.05">
          </label>
          <label>客隊賠率（最小）
            <input id="ahOpenAwayMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>客隊賠率（最大）
            <input id="ahOpenAwayMax" type="number" step="0.01" inputmode="decimal">
          </label>
        </div>
      </div>

      <div class="card">
        <h3>終盤</h3>
        <div class="fields">
          <label>盤口
            <select id="ahCloseLine"></select>
          </label>
          <label>主隊賠率（最小）
            <input id="ahCloseHomeMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>主隊賠率（最大）
            <input id="ahCloseHomeMax" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>客隊賠率（最小）
            <input id="ahCloseAwayMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>客隊賠率（最大）
            <input id="ahCloseAwayMax" type="number" step="0.01" inputmode="decimal">
          </label>
        </div>
      </div>
    </div>

    <div class="hint">
      <span>輸出比賽列表</span>
      <span class="status" id="ahStatus">資料載入中…</span>
    </div>

    <div class="table-wrap">
      <div class="table-title">結果</div>
      <div class="scroll">
        <table id="ahTable">
          <thead>
            <tr>
              <th>賽季</th><th>比賽</th>
              <th>初盤盤口</th><th>初盤主賠</th><th>初盤客賠</th>
              <th>終盤盤口</th><th>終盤主賠</th><th>終盤客賠</th>
              <th>盤口勝負</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 大小球 -->
  <section class="panel" id="tab-ou" role="tabpanel">
    <div class="panel-head">
      <b>大小球查詢</b>
      <div class="actions">
        <button class="btn primary" id="ouSearch">搜尋</button>
        <button class="btn" id="ouReset">重設</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>初盤</h3>
        <div class="fields">
          <label>盤口
            <select id="ouOpenLine"></select>
          </label>
          <label>大球賠率（最小）
            <input id="ouOpenOverMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>大球賠率（最大）
            <input id="ouOpenOverMax" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>細球賠率（最小）
            <input id="ouOpenUnderMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>細球賠率（最大）
            <input id="ouOpenUnderMax" type="number" step="0.01" inputmode="decimal">
          </label>
        </div>
      </div>

      <div class="card">
        <h3>終盤</h3>
        <div class="fields">
          <label>盤口
            <select id="ouCloseLine"></select>
          </label>
          <label>大球賠率（最小）
            <input id="ouCloseOverMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>大球賠率（最大）
            <input id="ouCloseOverMax" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>細球賠率（最小）
            <input id="ouCloseUnderMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>細球賠率（最大）
            <input id="ouCloseUnderMax" type="number" step="0.01" inputmode="decimal">
          </label>
        </div>
      </div>
    </div>

    <div class="hint">
      <span>輸出比賽列表</span>
      <span class="status" id="ouStatus">資料載入中…</span>
    </div>

    <div class="table-wrap">
      <div class="table-title">結果</div>
      <div class="scroll">
        <table id="ouTable">
          <thead>
            <tr>
              <th>賽季</th><th>比賽</th>
              <th>初盤盤口</th><th>初盤大</th><th>初盤細</th>
              <th>終盤盤口</th><th>終盤大</th><th>終盤細</th>
              <th>結果</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 歐洲盤 -->
  <section class="panel" id="tab-eu" role="tabpanel">
    <div class="panel-head">
      <b>歐洲盤查詢</b>
      <div class="actions">
        <button class="btn primary" id="euSearch">搜尋</button>
        <button class="btn" id="euReset">重設</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>初盤</h3>
        <div class="fields">
          <label>主勝（最小）
            <input id="euOpenHMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>主勝（最大）
            <input id="euOpenHMax" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>和局（最小）
            <input id="euOpenDMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>和局（最大）
            <input id="euOpenDMax" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>客勝（最小）
            <input id="euOpenAMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>客勝（最大）
            <input id="euOpenAMax" type="number" step="0.01" inputmode="decimal">
          </label>
        </div>
      </div>

      <div class="card">
        <h3>終盤</h3>
        <div class="fields">
          <label>主勝（最小）
            <input id="euCloseHMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>主勝（最大）
            <input id="euCloseHMax" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>和局（最小）
            <input id="euCloseDMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>和局（最大）
            <input id="euCloseDMax" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>客勝（最小）
            <input id="euCloseAMin" type="number" step="0.01" inputmode="decimal">
          </label>
          <label>客勝（最大）
            <input id="euCloseAMax" type="number" step="0.01" inputmode="decimal">
          </label>
        </div>
      </div>
    </div>

    <div class="hint">
      <span>輸出比賽列表</span>
      <span class="status" id="euStatus">資料載入中…</span>
    </div>

    <div class="table-wrap">
      <div class="table-title">結果</div>
      <div class="scroll">
        <table id="euTable">
          <thead>
            <tr>
              <th>賽季</th><th>比賽</th>
              <th>初盤(主/和/客)</th><th>終盤(主/和/客)</th>
              <th>比分</th><th>勝負</th><th>淨勝球</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

</div>

<script>
  const toast = document.getElementById("toast");
  function showError(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"), 4200);
  }

  // Tabs
  const tabs = Array.from(document.querySelectorAll(".tab"));
  const panels = Array.from(document.querySelectorAll(".panel"));
  tabs.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.target;
      tabs.forEach(t=>t.setAttribute("aria-selected", String(t===btn)));
      panels.forEach(p=>p.classList.toggle("active", p.id===id));
      toast.classList.remove("show");
    });
  });

  // 你現有資料載入與查詢邏輯，建議放喺呢度接入
  // TODO 1: 載入三份 JSON（或一份總 JSON）
  // TODO 2: 由資料生成盤口下拉選單（ahOpenLine/ahCloseLine/ouOpenLine/ouCloseLine）
  // TODO 3: 綁定搜尋與重設按鈕（ahSearch/ahReset/...）
  // TODO 4: 產生表格列並填入 tbody

  // 下面係示例：先把 status 由「資料載入中」改成「等待輸入」
  document.getElementById("ahStatus").textContent = "等待輸入條件";
  document.getElementById("ouStatus").textContent = "等待輸入條件";
  document.getElementById("euStatus").textContent = "等待輸入條件";

  // 示意：如果你未接入資料，下拉先放一個 placeholder，避免空白怪樣
  function fillPlaceholderSelect(id){
    const sel = document.getElementById(id);
    sel.innerHTML = "";
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "請先載入資料";
    sel.appendChild(opt);
  }
  ["ahOpenLine","ahCloseLine","ouOpenLine","ouCloseLine"].forEach(fillPlaceholderSelect);

  // 示意：先擋住搜尋，避免未接資料就報錯
  ["ahSearch","ouSearch","euSearch"].forEach(id=>{
    document.getElementById(id).addEventListener("click", ()=>{
      showError("未接入原本嘅資料載入與搜尋邏輯。將你現有 JS 接返入去就可以用。");
    });
  });
</script>
</body>
</html>
