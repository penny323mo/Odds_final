<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>足球歷史賠率大數據</title>
<meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" name="viewport"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#064e3b">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
    /* =========================================
       1. 核心主題 (Deep Green Stadium)
       ========================================= */
    :root {
        --bg-dark: #022c22; 
        --glass-bg: rgba(6, 78, 59, 0.75);
        --glass-border: rgba(52, 211, 153, 0.2);
        --brand-green: #10b981;
        --brand-green-light: #6ee7b7;
        --brand-accent: #fbbf24; /* 金色點綴 */
        --text-main: #ecfdf5;
        --text-sub: #a7f3d0;
    }

    body {
        margin: 0;
        font-family: 'Noto Sans TC', sans-serif;
        color: var(--text-main);
        background-color: var(--bg-dark);
        min-height: 100vh;
        padding-bottom: 120px;
        overflow-x: hidden;
        width: 100vw;
        padding-top: env(safe-area-inset-top);
    }

    /* =========================================
       2. 背景特效 (球場氛圍)
       ========================================= */
    .bg-layer {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
        background: radial-gradient(circle at 50% 0%, #104132 0%, #021a14 80%);
    }
    
    /* 網格紋理 (模擬球網/草地質感) */
    .bg-texture {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        background-image: 
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 30px 30px;
        mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.2) 100%);
        pointer-events: none;
    }

    /* =========================================
       3. 頂部導航 (Header) - 呼吸燈 & 旋轉Logo
       ========================================= */
    .header { 
        position: relative; text-align: center; padding: 30px 20px 20px; z-index: 10; 
    }
    
    .header h1 {
        font-weight: 900;
        font-size: clamp(1.8rem, 6vw, 3rem); 
        margin: 0; color: #fff;
        display: flex; align-items: center; justify-content: center; gap: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
        /* 呼吸燈特效 */
        animation: glowBreathing 3s ease-in-out infinite alternate;
    }

    @keyframes glowBreathing {
        0% { text-shadow: 0 0 10px rgba(16, 185, 129, 0.3), 0 0 20px rgba(5, 150, 105, 0.1); transform: scale(1); }
        100% { text-shadow: 0 0 25px rgba(52, 211, 153, 0.8), 0 0 40px rgba(16, 185, 129, 0.5); transform: scale(1.02); }
    }

    /* 旋轉足球 */
    .football-logo {
        width: clamp(40px, 8vw, 60px);
        height: clamp(40px, 8vw, 60px);
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        animation: slowSpin 10s linear infinite;
    }
    @keyframes slowSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .header .desc {
        margin-top: 8px; font-size: 0.9rem; color: var(--brand-green-light);
        background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.1); display: inline-block;
    }

    .nav-container { margin-bottom: 20px; z-index: 20; position: relative; padding: 0 15px; }
    .custom-tabs {
        background: rgba(0, 30, 20, 0.8); border: 1px solid rgba(255,255,255,0.15);
        border-radius: 50px; padding: 4px; display: flex; gap: 5px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4); backdrop-filter: blur(10px);
        max-width: 500px; margin: 0 auto;
    }
    .custom-tabs button {
        flex: 1; border: none; background: transparent; color: #9ca3af;
        padding: 10px 0; font-weight: 700; font-size: 0.95rem; border-radius: 40px;
        transition: all 0.3s;
    }
    .custom-tabs button.active { 
        background: #fff; color: #064e3b; 
        box-shadow: 0 4px 12px rgba(255,255,255,0.3);
    }

    /* =========================================
       4. 卡片容器 & 輸入框 (Smart Responsive)
       ========================================= */
    .tabcontent {
        width: 94%; max-width: 900px; margin: 0 auto; 
        animation: slideUp 0.4s ease-out;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .unified-card {
        background: var(--glass-bg); 
        border: 1px solid var(--glass-border);
        border-radius: 24px; padding: 20px;
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 20px 50px -10px rgba(0,0,0,0.6);
    }

    fieldset {
        border: 1px solid rgba(255,255,255,0.1); background: rgba(0, 0, 0, 0.25);
        border-radius: 16px; padding: 15px; margin-bottom: 15px;
    }
    legend {
        color: var(--brand-green-light); font-weight: 700; font-size: 1rem;
        display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .input-label {
        font-size: 0.8rem; color: #d1fae5; margin-bottom: 5px; display: block; font-weight: 500;
    }
    
    .custom-input-group {
        display: flex; align-items: stretch; background: rgba(0, 15, 10, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
        overflow: hidden; height: 44px; transition: border-color 0.2s;
    }
    .custom-input-group:focus-within { border-color: var(--brand-green); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3); }
    
    .main-input {
        flex: 1; background: transparent; border: none; color: #fff; padding: 0 10px;
        font-family: monospace; font-size: 1.1rem; min-width: 0;
    }
    .main-input:focus { outline: none; }
    
    .err-input { width: 50px; background: rgba(255,255,255,0.05); border: none; border-left: 1px solid rgba(255,255,255,0.1); color: #a7f3d0; text-align: center; font-size: 0.9rem; }
    .step-btns { display: flex; flex-direction: column; width: 28px; border-left: 1px solid rgba(255,255,255,0.1); }
    .step-btn { flex: 1; background: rgba(255,255,255,0.02); border: none; color: var(--brand-green); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; padding: 0; }
    .step-btn:hover { background: rgba(255,255,255,0.15); }

    select.form-select-custom {
        width: 100%; height: 44px; background-color: rgba(2, 44, 34, 0.9); color: #fff; 
        border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 0 12px;
    }

    /* === 關鍵：iPad/Desktop 佈局優化 === */
    /* 在手機上是垂直堆疊 (預設) */
    .form-flex-container { display: flex; flex-direction: column; gap: 15px; }
    .odds-grid { display: flex; flex-direction: column; gap: 10px; }

    /* 在 iPad (>= 768px) 上轉為橫排 */
    @media (min-width: 768px) {
        .form-flex-container { 
            flex-direction: row; /* 初盤和終盤左右並排 */
        }
        fieldset { flex: 1; }
        
        /* 讓賠率輸入框 (主/和/客) 在同一行顯示 */
        .odds-grid {
            display: grid;
            gap: 12px;
        }
        /* 2欄佈局 (亞盤/大小球) */
        .grid-2 { grid-template-columns: 1fr 1fr; }
        /* 3欄佈局 (歐盤) */
        .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
        
        /* 調整按鈕大小 */
        .btn-3d { font-size: 1.1rem; padding: 14px; }
    }

    /* =========================================
       5. 按鈕 (3D Effect)
       ========================================= */
    .action-row { display: flex; gap: 12px; margin-top: 20px; }
    .btn-3d {
        flex: 1; border: none; color: white; font-weight: 700; font-size: 1rem; 
        padding: 12px; border-radius: 50px; cursor: pointer; 
        display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: transform 0.1s;
    }
    .btn-green {
        background: linear-gradient(180deg, #34d399 0%, #059669 100%);
        box-shadow: 0 5px 0 #064e3b, 0 10px 20px rgba(0,0,0,0.4);
    }
    .btn-grey {
        background: linear-gradient(180deg, #9ca3af 0%, #4b5563 100%);
        box-shadow: 0 5px 0 #1f2937, 0 10px 20px rgba(0,0,0,0.4);
    }
    .btn-3d:active { transform: translateY(5px); box-shadow: 0 0 0 #064e3b; }

    /* =========================================
       6. 結果與列表 (Multi-Select included)
       ========================================= */
    .results-section { margin-top: 25px; padding-top: 20px; border-top: 1px dashed rgba(255,255,255,0.2); display: none; }

    .stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px 5px; text-align: center; }
    .stat-card.win { border-bottom: 4px solid #ef4444; } 
    .stat-card.draw { border-bottom: 4px solid #22c55e; } 
    .stat-card.lose { border-bottom: 4px solid #3b82f6; }
    .stat-card .value { font-size: 1.5rem; font-weight: 900; color: #fff; display: block; }
    .stat-card .pct { font-size: 0.8rem; opacity: 0.8; }

    /* 圓餅圖容器 */
    .piebox {
        background: rgba(0,0,0,0.2); border-radius: 20px; padding: 20px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 250px;
    }

    /* 多選下拉選單 */
    .list-section { display: none; margin-top: 20px; animation: slideUp 0.3s ease-out; }
    .multi-select-container { position: relative; margin-bottom: 15px; }
    .multi-select-btn {
        width: 100%; padding: 12px; border-radius: 12px;
        background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.3);
        text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .multi-select-dropdown {
        display: none; position: absolute; top: 105%; left: 0; width: 100%;
        background: #064e3b; border: 1px solid rgba(255,255,255,0.3);
        border-radius: 12px; max-height: 280px; overflow-y: auto; z-index: 100;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .multi-select-dropdown.show { display: block; }
    .multi-actions {
        padding: 8px; position: sticky; top: 0; background: #022c22; z-index: 2;
        display: flex; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .btn-sm-action { flex: 1; border: none; padding: 6px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
    .multi-select-option {
        padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
        cursor: pointer; display: flex; align-items: center; gap: 10px;
    }
    .multi-select-option:hover { background: rgba(255,255,255,0.1); }
    .multi-select-option input { transform: scale(1.3); accent-color: var(--brand-green); }

    /* 表格 */
    .table-container { background: rgba(0,0,0,0.3); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
    th { background: rgba(0,0,0,0.6); padding: 12px; color: #6ee7b7; cursor: pointer; }
    td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
    tr:hover { background: rgba(255,255,255,0.1); }
    .badge-res { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
    .bg-win { background: #ef4444; color: #fff; }
    .bg-draw { background: #22c55e; color: #fff; }
    .bg-lose { background: #3b82f6; color: #fff; }

    /* Loading Overlay */
    #loadingOverlay { position: fixed; inset: 0; background: #022c22; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .spinner-ball { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #34d399; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-texture"></div>

<div id="loadingOverlay">
    <div class="spinner-ball"></div>
    <div style="margin-top:15px; color:#a7f3d0; font-weight:bold;">資料載入中...</div>
</div>

<div class="header">
    <h1>
        <svg class="football-logo" viewBox="0 0 512 512" fill="white" xmlns="http://www.w3.org/2000/svg">
            <path d="M256,48C141.1,48,48,141.1,48,256s93.1,208,208,208s208-93.1,208-208S370.9,48,256,48z M256,424.7 c-28.7,0-55.8-7.2-79.7-19.8l56.8-98.4l22.9,0l56.8,98.4C289.8,419.6,273.4,424.7,256,424.7z M148.9,385.1 c-19.4-23.7-32.5-52.6-36.4-84.3l98.4-56.8l11.4,19.8L148.9,385.1z M128.5,236.2c0-8.9,1.1-17.5,3.2-25.8l110.1,29.5L128.5,236.2z M157,143.5c16.3-17.3,36.5-31.5,59.3-40.9l39.7,105.7L157,143.5z M256,87.3c27.6,0,53.6,7.6,76.1,20.8l-38.3,101.9h-75.6 L256,87.3z M355,143.5l-99,64.8l39.7-105.7C318.5,112,338.7,126.2,355,143.5z M380.3,210.4l-110.1-29.5l113.3,3.3 C383.5,192.5,382.4,201.6,380.3,210.4z M363.1,385.1l-73.4-121.4l11.4-19.8l98.4,56.8C395.6,332.5,382.5,361.4,363.1,385.1z"/>
        </svg>
        足球歷史賠率篩選
    </h1>
    <div class="desc">大數據分析 (2013-2025)</div>
</div>

<div class="nav-container">
    <div class="custom-tabs">
        <button class="active" onclick="showTab(0)">亞洲盤</button>
        <button onclick="showTab(1)">大小球</button>
        <button onclick="showTab(2)">歐洲盤</button>
    </div>
</div>

<div class="tabcontent" id="tc1">
    <div class="unified-card">
        <form id="ahForm" onsubmit="return false;">
            <div class="form-flex-container">
                <fieldset>
                    <legend><i class="bi bi-crosshair"></i> 初盤資料</legend>
                    <div class="input-row" style="margin-bottom:12px;">
                        <label class="input-label">讓球盤口</label>
                        <select id="ahInitHand" class="form-select-custom"></select>
                    </div>
                    <div class="odds-grid grid-2">
                        <div>
                            <label class="input-label">主隊賠率</label>
                            <div class="custom-input-group">
                                <input id="ahHomeExact" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="ahHomeErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                        <div>
                            <label class="input-label">客隊賠率</label>
                            <div class="custom-input-group">
                                <input id="ahAwayExact" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="ahAwayErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend><i class="bi bi-flag-fill"></i> 終盤資料</legend>
                    <div class="input-row" style="margin-bottom:12px;">
                        <label class="input-label">終盤盤口</label>
                        <select id="ahCloseHand" class="form-select-custom"></select>
                    </div>
                    <div class="odds-grid grid-2">
                        <div>
                            <label class="input-label">主隊賠率</label>
                            <div class="custom-input-group">
                                <input id="ahCloseHomeExact" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="ahCloseHomeErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                        <div>
                            <label class="input-label">客隊賠率</label>
                            <div class="custom-input-group">
                                <input id="ahCloseAwayExact" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="ahCloseAwayErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>

            <div class="action-row">
                <button class="btn-3d btn-green" onclick="doAhSearch()"><i class="bi bi-search"></i> 搜尋</button>
                <button class="btn-3d btn-grey" id="resetAhBtn"><i class="bi bi-arrow-counterclockwise"></i> 重設</button>
            </div>
        </form>

        <div id="ahResultSection" class="results-section">
            <div id="ahStat"></div>
            <button class="btn-3d btn-grey" onclick="toggleList('ah')" style="margin-top:15px; border-radius:15px; font-size:0.9rem;">
                <i class="bi bi-list-ul"></i> 顯示 / 隱藏 詳細列表
            </button>
            <div id="ahListSection" class="list-section">
                <div class="multi-select-container">
                    <label class="input-label">📅 賽季篩選 (可多選)</label>
                    <div class="multi-select-btn" onclick="toggleSeasonDropdown('ah')" id="seasonBtn_ah">全選</div>
                    <div class="multi-select-dropdown" id="seasonDropdown_ah">
                        <div class="multi-actions">
                            <button class="btn-sm-action" style="background:#10b981;color:#fff" onclick="selectAllSeasons('ah', true)">全選</button>
                            <button class="btn-sm-action" style="background:#ef4444;color:#fff" onclick="selectAllSeasons('ah', false)">清空</button>
                        </div>
                        <div id="seasonOptions_ah"></div>
                    </div>
                </div>
                <div class="table-container" id="ahTableContainer">
                    <div style="overflow-x:auto;">
                        <table id="ahTable">
                            <thead><tr><th>賽季</th><th>比賽</th><th>比分</th><th>初盤</th><th>主賠</th><th>客賠</th><th>終盤</th><th>主賠</th><th>客賠</th><th>結果</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="tabcontent" id="tc2" style="display:none">
    <div class="unified-card">
        <form id="ouForm" onsubmit="return false;">
            <div class="form-flex-container">
                <fieldset>
                    <legend><i class="bi bi-stopwatch"></i> 初盤資料</legend>
                    <div class="input-row" style="margin-bottom:12px;">
                        <label class="input-label">大小盤口</label>
                        <select id="ouInitLine" class="form-select-custom"></select>
                    </div>
                    <div class="odds-grid grid-2">
                        <div>
                            <label class="input-label">大球賠率</label>
                            <div class="custom-input-group">
                                <input id="ouBigExact" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="ouBigErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                        <div>
                            <label class="input-label">細球賠率</label>
                            <div class="custom-input-group">
                                <input id="ouSmallExact" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="ouSmallErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                    </div>
                </fieldset>
                <fieldset>
                    <legend><i class="bi bi-flag-fill"></i> 終盤資料</legend>
                    <div class="input-row" style="margin-bottom:12px;">
                        <label class="input-label">終盤盤口</label>
                        <select id="ouCloseLine" class="form-select-custom"></select>
                    </div>
                    <div class="odds-grid grid-2">
                        <div>
                            <label class="input-label">大球賠率</label>
                            <div class="custom-input-group">
                                <input id="ouBigExactC" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="ouBigErrC" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                        <div>
                            <label class="input-label">細球賠率</label>
                            <div class="custom-input-group">
                                <input id="ouSmallExactC" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="ouSmallErrC" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>
            <div class="action-row">
                <button class="btn-3d btn-green" onclick="doOuSearch()"><i class="bi bi-search"></i> 搜尋</button>
                <button class="btn-3d btn-grey" id="resetOuBtn"><i class="bi bi-arrow-counterclockwise"></i> 重設</button>
            </div>
        </form>
        <div id="ouResultSection" class="results-section">
            <div id="ouStat"></div>
            <button class="btn-3d btn-grey" onclick="toggleList('ou')" style="margin-top:15px; border-radius:15px; font-size:0.9rem;">
                <i class="bi bi-list-ul"></i> 顯示 / 隱藏 詳細列表
            </button>
            <div id="ouListSection" class="list-section">
                 <div class="multi-select-container">
                    <label class="input-label">📅 賽季篩選 (可多選)</label>
                    <div class="multi-select-btn" onclick="toggleSeasonDropdown('ou')" id="seasonBtn_ou">全選</div>
                    <div class="multi-select-dropdown" id="seasonDropdown_ou">
                        <div class="multi-actions">
                            <button class="btn-sm-action" style="background:#10b981;color:#fff" onclick="selectAllSeasons('ou', true)">全選</button>
                            <button class="btn-sm-action" style="background:#ef4444;color:#fff" onclick="selectAllSeasons('ou', false)">清空</button>
                        </div>
                        <div id="seasonOptions_ou"></div>
                    </div>
                </div>
                <div class="table-container" id="ouTableContainer">
                    <div style="overflow-x:auto;">
                        <table id="ouTable">
                            <thead><tr><th>賽季</th><th>比賽</th><th>比分</th><th>初盤</th><th>大</th><th>細</th><th>終盤</th><th>大</th><th>細</th><th>結果</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="tabcontent" id="tc3" style="display:none">
    <div class="unified-card">
        <form id="euForm" onsubmit="return false;">
            <div class="form-flex-container">
                <fieldset>
                    <legend><i class="bi bi-globe-europe-africa"></i> 初盤資料</legend>
                    <div class="odds-grid grid-3">
                        <div>
                            <label class="input-label">主勝</label>
                            <div class="custom-input-group">
                                <input id="euHomeExact" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="euHomeErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                        <div>
                            <label class="input-label">和局</label>
                            <div class="custom-input-group">
                                <input id="euDrawExact" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="euDrawErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                        <div>
                            <label class="input-label">客勝</label>
                            <div class="custom-input-group">
                                <input id="euAwayExact" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="euAwayErr" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                    </div>
                </fieldset>
                <fieldset>
                    <legend><i class="bi bi-flag-fill"></i> 終盤資料</legend>
                    <div class="odds-grid grid-3">
                        <div>
                            <label class="input-label">主勝</label>
                            <div class="custom-input-group">
                                <input id="euHomeExactC" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="euHomeErrC" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                        <div>
                            <label class="input-label">和局</label>
                            <div class="custom-input-group">
                                <input id="euDrawExactC" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="euDrawErrC" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                        <div>
                            <label class="input-label">客勝</label>
                            <div class="custom-input-group">
                                <input id="euAwayExactC" class="main-input" placeholder="數值" step="0.01" type="number"/>
                                <input id="euAwayErrC" class="err-input" step="0.01" type="number" value="0.05"/>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>
            <div class="action-row">
                <button class="btn-3d btn-green" onclick="doEuSearch()"><i class="bi bi-search"></i> 搜尋</button>
                <button class="btn-3d btn-grey" id="resetEuBtn"><i class="bi bi-arrow-counterclockwise"></i> 重設</button>
            </div>
        </form>
        <div id="euResultSection" class="results-section">
            <div id="euStat"></div>
            <button class="btn-3d btn-grey" onclick="toggleList('eu')" style="margin-top:15px; border-radius:15px; font-size:0.9rem;">
                <i class="bi bi-list-ul"></i> 顯示 / 隱藏 詳細列表
            </button>
            <div id="euListSection" class="list-section">
                <div class="multi-select-container">
                    <label class="input-label">📅 賽季篩選 (可多選)</label>
                    <div class="multi-select-btn" onclick="toggleSeasonDropdown('eu')" id="seasonBtn_eu">全選</div>
                    <div class="multi-select-dropdown" id="seasonDropdown_eu">
                        <div class="multi-actions">
                            <button class="btn-sm-action" style="background:#10b981;color:#fff" onclick="selectAllSeasons('eu', true)">全選</button>
                            <button class="btn-sm-action" style="background:#ef4444;color:#fff" onclick="selectAllSeasons('eu', false)">清空</button>
                        </div>
                        <div id="seasonOptions_eu"></div>
                    </div>
                </div>
                <div class="table-container" id="euTableContainer">
                    <div style="overflow-x:auto;">
                        <table id="euTable">
                            <thead><tr><th>賽季</th><th>比賽</th><th>比分</th><th>初盤(1X2)</th><th>終盤(1X2)</th><th>勝負</th><th>淨勝</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    /* 1. 全局變量 */
    let AH = null, OU = null, EU = null;
    let selectedSeasons = new Set();
    let lastAhResult = [], lastOuResult = [], lastEuResult = [];
    
    // JSON 資料庫路徑
    const DB = {
      asian:     { base: 'asian_handicap', subdir: '' },
      overUnder: { base: 'over_under',     subdir: '' },
      european:  { base: 'european_odds',  subdir: '' }
    };

    const overlay = document.getElementById('loadingOverlay');

    function showTab(i) {
        const tabs = ["tc1", "tc2", "tc3"];
        const btns = document.querySelectorAll(".custom-tabs button");
        tabs.forEach((id, idx) => {
            const el = document.getElementById(id);
            if(idx === i) {
                el.style.display = "block";
                el.style.animation = 'none'; el.offsetHeight; el.style.animation = 'slideUp 0.4s ease-out';
                btns[idx].classList.add("active");
            } else {
                el.style.display = "none";
                btns[idx].classList.remove("active");
            }
        });
    }

    function range(exId, erId) {
        const ex = parseFloat(document.getElementById(exId).value);
        const er = parseFloat(document.getElementById(erId).value) || 0;
        return isNaN(ex) ? [null, null] : [ex - er, ex + er];
    }

    function pct(n, t) { return t ? ((n / t * 100).toFixed(1) + '%') : '0.0%'; }

    // === 動畫與圖表 ===
    function animateValue(obj, start, end, duration) {
        if (!obj) return;
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start);
            if (progress < 1) window.requestAnimationFrame(step);
            else obj.innerHTML = end;
        };
        window.requestAnimationFrame(step);
    }

    function renderStats(w, d, l, wL, dL, lL, tot, prefix, extra='') {
        document.getElementById(prefix+'Stat').innerHTML = `
        <div class="stat-cards">
            <div class="stat-card win"><span class="value" id="${prefix}Win">0</span><span class="pct">${wL} ${pct(w,tot)}</span></div>
            <div class="stat-card draw"><span class="value" id="${prefix}Draw">0</span><span class="pct">${dL} ${pct(d,tot)}</span></div>
            <div class="stat-card lose"><span class="value" id="${prefix}Lose">0</span><span class="pct">${lL} ${pct(l,tot)}</span></div>
        </div>
        ${extra ? `<div class="text-center mb-3" style="font-size:0.9rem;color:#a7f3d0">${extra}</div>` : ''}
        <div class="piebox" id="${prefix}Pie"></div>
        `;
        // Count Up
        setTimeout(()=> {
            animateValue(document.getElementById(prefix+'Win'), 0, w, 800);
            animateValue(document.getElementById(prefix+'Draw'), 0, d, 800);
            animateValue(document.getElementById(prefix+'Lose'), 0, l, 800);
        }, 100);
        // Pie
        setTimeout(()=> {
            const p = document.getElementById(prefix+'Pie');
            if(p) {
                p.innerHTML = drawPieChart([
                    { val: w, color: '#ef4444' }, { val: d, color: '#22c55e' }, { val: l, color: '#3b82f6' }
                ]);
            }
        }, 500);
    }

    function drawPieChart(data) {
        const total = data.reduce((s,x)=>s+x.val,0);
        if(!total) return '';
        let ang = 0, parts = [];
        data.forEach(d => {
            if(d.val>0) {
                const deg = (d.val/total)*360;
                parts.push(`${d.color} ${ang}deg ${ang+deg}deg`);
                ang += deg;
            }
        });
        return `<div style="width:200px;height:200px;border-radius:50%;background:conic-gradient(${parts.join(', ')})"></div>`;
    }

    // === 多選下拉單 (Multi-Select) 邏輯 ===
    function populateSeasons(type, data) {
        selectedSeasons.clear();
        const seasons = [...new Set(data.map(d => d.season))].sort().reverse();
        const div = document.getElementById(`seasonOptions_${type}`);
        
        div.innerHTML = seasons.map(s => `
            <div class="multi-select-option" onclick="toggleSeason(this, '${s}', '${type}')">
                <input type="checkbox" checked> <span>${s}</span>
            </div>
        `).join('');
        
        seasons.forEach(s => selectedSeasons.add(s));
        updateSeasonBtn(type);
    }
    
    function toggleSeasonDropdown(type) {
        const dd = document.getElementById(`seasonDropdown_${type}`);
        dd.classList.toggle('show');
    }
    
    function toggleSeason(el, val, type) {
        const cb = el.querySelector('input');
        cb.checked = !cb.checked;
        if(cb.checked) selectedSeasons.add(val); else selectedSeasons.delete(val);
        updateSeasonBtn(type);
        rerenderTable(type);
    }
    
    function selectAllSeasons(type, isAll) {
        const cbs = document.querySelectorAll(`#seasonOptions_${type} input`);
        cbs.forEach(cb => {
            cb.checked = isAll;
            const val = cb.parentNode.innerText.trim();
            if(isAll) selectedSeasons.add(val); else selectedSeasons.delete(val);
        });
        updateSeasonBtn(type);
        rerenderTable(type);
    }
    
    function updateSeasonBtn(type) {
        const btn = document.getElementById(`seasonBtn_${type}`);
        const all = document.querySelectorAll(`#seasonOptions_${type} input`).length;
        const sel = selectedSeasons.size;
        btn.innerText = (sel === all) ? "已選: 全部" : `已選: ${sel} 個賽季`;
    }
    
    function rerenderTable(type) {
        let raw = (type==='ah') ? lastAhResult : (type==='ou' ? lastOuResult : lastEuResult);
        const filtered = raw.filter(r => selectedSeasons.has(r.season));
        renderTable(type, filtered);
    }

    // === 數據加載 ===
    async function loadData(base) {
        const urls = [`${base}.json`];
        for(let i=1; i<=10; i++) urls.push(`${base}${i}.json`);
        const res = await Promise.allSettled(urls.map(u => fetch(u).then(r=>r.ok?r.json():null)));
        let m = [];
        res.forEach(r => { if(r.status==='fulfilled' && Array.isArray(r.value)) m.push(...r.value); });
        return m;
    }

    // === 搜尋邏輯 ===
    function doAhSearch() {
        const [h1,h2] = range('ahHomeExact','ahHomeErr'), [a1,a2] = range('ahAwayExact','ahAwayErr');
        const [hc1,hc2] = range('ahCloseHomeExact','ahCloseHomeErr'), [ac1,ac2] = range('ahCloseAwayExact','ahCloseAwayErr');
        const oH = document.getElementById('ahInitHand').value, cH = document.getElementById('ahCloseHand').value;
        
        lastAhResult = AH.filter(r => {
            if(oH && r.AH_open_handicap != oH) return false;
            if(cH && r.AH_close_handicap != cH) return false;
            if(h1!=null && (r.AH_open_home_odds < h1 || r.AH_open_home_odds > h2)) return false;
            if(a1!=null && (r.AH_open_away_odds < a1 || r.AH_open_away_odds > a2)) return false;
            if(hc1!=null && (r.AH_close_home_odds < hc1 || r.AH_close_home_odds > hc2)) return false;
            if(ac1!=null && (r.AH_close_away_odds < ac1 || r.AH_close_away_odds > ac2)) return false;
            return true;
        });

        let w=0, d=0, l=0;
        lastAhResult.forEach(r => {
            const [x,y] = r.ft_score.split('-').map(Number);
            const diff = x + r.AH_close_handicap - y;
            if(diff>0) w++; else if(diff<0) l++; else d++;
        });
        
        document.getElementById('ahResultSection').style.display='block';
        renderStats(w,d,l,'贏','走','輸',lastAhResult.length,'ah');
        document.getElementById('ahListSection').style.display='none';
        populateSeasons('ah', lastAhResult);
    }

    function doOuSearch() {
        const [b1,b2] = range('ouBigExact','ouBigErr'), [s1,s2] = range('ouSmallExact','ouSmallErr');
        const [bc1,bc2] = range('ouBigExactC','ouBigErrC'), [sc1,sc2] = range('ouSmallExactC','ouSmallErrC');
        const oL = document.getElementById('ouInitLine').value, cL = document.getElementById('ouCloseLine').value;

        lastOuResult = OU.filter(r => {
            if(oL && r.OU_line != oL) return false;
            if(cL && r.close_OU_line != cL) return false;
            if(b1!=null && (r.OU_open_over_odds < b1 || r.OU_open_over_odds > b2)) return false;
            if(s1!=null && (r.OU_open_under_odds < s1 || r.OU_open_under_odds > s2)) return false;
            if(bc1!=null && (r.OU_close_over_odds < bc1 || r.OU_close_over_odds > bc2)) return false;
            if(sc1!=null && (r.OU_close_under_odds < sc1 || r.OU_close_under_odds > sc2)) return false;
            return true;
        });

        let o=0, p=0, u=0;
        lastOuResult.forEach(r => {
            const sum = r.ft_score.split('-').reduce((a,b)=>+a+(+b),0);
            if(sum > r.close_OU_line) o++; else if(sum < r.close_OU_line) u++; else p++;
        });

        document.getElementById('ouResultSection').style.display='block';
        renderStats(o,p,u,'大','走','小',lastOuResult.length,'ou');
        document.getElementById('ouListSection').style.display='none';
        populateSeasons('ou', lastOuResult);
    }

    function getE(r, k) {
        // Helper to find euro odds
        const map = {
            oh: ['EU_open_home_odds','1X2_open_home_odds'], od: ['EU_open_draw_odds','1X2_open_draw_odds'], oa: ['EU_open_away_odds','1X2_open_away_odds'],
            ch: ['EU_close_home_odds','1X2_close_home_odds'], cd: ['EU_close_draw_odds','1X2_close_draw_odds'], ca: ['EU_close_away_odds','1X2_close_away_odds']
        };
        for(let f of map[k]) if(r[f]!=null) return r[f];
        return null;
    }

    function doEuSearch() {
        const [h1,h2] = range('euHomeExact','euHomeErr'), [d1,d2] = range('euDrawExact','euDrawErr'), [a1,a2] = range('euAwayExact','euAwayErr');
        const [hc1,hc2] = range('euHomeExactC','euHomeErrC'), [dc1,dc2] = range('euDrawExactC','euDrawErrC'), [ac1,ac2] = range('euAwayExactC','euAwayErrC');

        lastEuResult = EU.filter(r => {
            const oh=getE(r,'oh'), od=getE(r,'od'), oa=getE(r,'oa'), ch=getE(r,'ch'), cd=getE(r,'cd'), ca=getE(r,'ca');
            if(h1!=null && (oh<h1 || oh>h2)) return false;
            if(d1!=null && (od<d1 || od>d2)) return false;
            if(a1!=null && (oa<a1 || oa>a2)) return false;
            if(hc1!=null && (ch<hc1 || ch>hc2)) return false;
            if(dc1!=null && (cd<dc1 || cd>dc2)) return false;
            if(ac1!=null && (ca<ac1 || ca>ac2)) return false;
            return true;
        });

        let w=0, d=0, l=0;
        lastEuResult.forEach(r => {
            const [x,y] = r.ft_score.split('-').map(Number);
            if(x>y) w++; else if(x<y) l++; else d++;
        });

        document.getElementById('euResultSection').style.display='block';
        renderStats(w,d,l,'主','和','客',lastEuResult.length,'eu');
        document.getElementById('euListSection').style.display='none';
        populateSeasons('eu', lastEuResult);
    }

    function renderTable(type, data) {
        const tb = document.getElementById(type+'Table').querySelector('tbody');
        if(data.length > 3000) {
            tb.innerHTML = '<tr><td colspan="10">資料過多 (>3000)，請縮小範圍或選擇賽季</td></tr>';
            return;
        }
        
        let html = '';
        if(type === 'ah') {
            html = data.map(r => {
                const [h,a] = r.ft_score.split('-');
                const diff = +h + r.AH_close_handicap - +a;
                const res = diff>0 ? '<span class="badge-res bg-win">贏</span>' : diff<0 ? '<span class="badge-res bg-lose">輸</span>' : '<span class="badge-res bg-draw">走</span>';
                return `<tr><td>${r.season}</td><td>${r.home_team}<br>vs<br>${r.away_team}</td><td>${r.ft_score}</td><td>${r.AH_open_handicap}</td><td>${r.AH_open_home_odds}</td><td>${r.AH_open_away_odds}</td><td>${r.AH_close_handicap}</td><td>${r.AH_close_home_odds}</td><td>${r.AH_close_away_odds}</td><td>${res}</td></tr>`;
            }).join('');
        } else if(type === 'ou') {
            html = data.map(r => {
                const sum = r.ft_score.split('-').reduce((x,y)=>+x+(+y),0);
                const res = sum > r.close_OU_line ? '<span class="badge-res bg-win">大</span>' : sum < r.close_OU_line ? '<span class="badge-res bg-lose">細</span>' : '<span class="badge-res bg-draw">走</span>';
                return `<tr><td>${r.season}</td><td>${r.home_team}<br>vs<br>${r.away_team}</td><td>${r.ft_score}</td><td>${r.OU_line}</td><td>${r.OU_open_over_odds}</td><td>${r.OU_open_under_odds}</td><td>${r.close_OU_line}</td><td>${r.OU_close_over_odds}</td><td>${r.OU_close_under_odds}</td><td>${res}</td></tr>`;
            }).join('');
        } else {
            html = data.map(r => {
                const [h,a] = r.ft_score.split('-').map(Number);
                const res = h>a ? '<span class="badge-res bg-win">主</span>' : h<a ? '<span class="badge-res bg-lose">客</span>' : '<span class="badge-res bg-draw">和</span>';
                return `<tr><td>${r.season}</td><td>${r.home_team}<br>vs<br>${r.away_team}</td><td>${r.ft_score}</td><td>${getE(r,'oh')}/${getE(r,'od')}/${getE(r,'oa')}</td><td>${getE(r,'ch')}/${getE(r,'cd')}/${getE(r,'ca')}</td><td>${res}</td><td>${h-a}</td></tr>`;
            }).join('');
        }
        tb.innerHTML = html;
        document.getElementById(type+'ListSection').style.display='block';
        document.getElementById(type+'TableContainer').style.display='block';
    }

    function toggleList(type) {
        const sec = document.getElementById(type+'ListSection');
        sec.style.display = (sec.style.display==='none') ? 'block' : 'none';
        if(sec.style.display === 'block') rerenderTable(type);
    }
    
    ['resetAhBtn', 'resetOuBtn', 'resetEuBtn'].forEach(id => {
        document.getElementById(id).addEventListener('click', () => {
             document.forms[id.replace('reset','').replace('Btn','').toLowerCase()+'Form'].reset();
             document.getElementById(id.replace('reset','').replace('Btn','').toLowerCase()+'ResultSection').style.display='none';
        });
    });
    
    // 初始化
    (async () => {
        try {
            [AH, OU, EU] = await Promise.all([loadData(DB.asian.base), loadData(DB.overUnder.base), loadData(DB.european.base)]);
            // Fill Selects
            const s1=new Set(AH.map(r=>r.AH_open_handicap)), s2=new Set(AH.map(r=>r.AH_close_handicap));
            const fill = (id, set) => document.getElementById(id).innerHTML = '<option value="">--</option>' + [...set].filter(v=>v!=null).sort((a,b)=>a-b).map(v=>`<option value="${v}">${v}</option>`).join('');
            fill('ahInitHand', s1); fill('ahCloseHand', s2);
            fill('ouInitLine', new Set(OU.map(r=>r.OU_line))); fill('ouCloseLine', new Set(OU.map(r=>r.close_OU_line)));
        } catch(e) { 
            console.error(e);
            document.getElementById('loadingOverlay').innerHTML = '<span style="color:#ef4444;font-weight:bold;">數據載入失敗</span>';
        } finally { overlay.style.display = 'none'; }
    })();
    
    // Close Dropdown on outside click
    window.onclick = function(e) {
        if(!e.target.closest('.multi-select-container')) {
            document.querySelectorAll('.multi-select-dropdown').forEach(d=>d.classList.remove('show'));
        }
    }
</script>
</body>
</html>
