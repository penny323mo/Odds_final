<style>
    /***********************************************/
    /* 全局樣式                                    */

    /* ---------- 全局重置 ---------- */
    body {
      margin: 0;

    }
    a { text-decoration:none; }
    /* ---------- Header ---------- */
    .header {
      background: #1666c1;
      color: #fff;
      text-align: center;
      padding: 24px 0 8px;
    }
    .header h1 {
      margin: 0;
      font-size: 2.4rem;
      font-weight: bold;
    }
    .header .desc {
      margin: 6px 12px 0;
      font-size: clamp(0.8rem,1.5vw,1rem);
      font-weight: 300;
      white-space: normal;
      line-height:1.4;
    }
    /* ---------- Tabs ---------- */
    .tabbar {
      display: flex;
      background: #e7f0fb;
      border-bottom: 1px solid #dbe7f5;
    }
    .tabbar button {
      flex: 1;
      padding: 12px 0;
      font-size: 1.1rem;
      font-weight: bold;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: .2s;
    }
    .tabbar button.active {
      color: #1666c1;
      background: #fff;
      border-bottom: 3px solid #1666c1;
    }
    /* ---------- Timestamp ---------- */
    .timestamp {
      text-align: center;
      color: #444;
      font-size: .95rem;
      margin: 10px 0 12px;
    }
    /* ---------- Container ---------- */
    .tabcontent {
      max-width: 920px;
      margin: 0 auto 24px;
      background: #fff;
      border-radius: 8px;
      padding: 20px 16px;
      box-shadow: 0 3px 18px rgba(138,179,233,.16);
    }
    @media(max-width:850px) {
      .tabcontent {
        padding: 16px 4vw;
      }
    }
    /* ---------- Fieldset & Form ---------- */
    fieldset {
      margin-bottom: 18px;
      border: 1.5px solid #c3daf7;
      border-radius: 6px;
      background: #f9fcff;
      padding: 12px 16px 16px;
    }
    legend {
      padding: 0 8px;
      font-size: 1.15rem;
      font-weight: bold;
      color: #1666c1;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin: 8px 0;
    }
    .row label {
      width: 100px;
      text-align: right;
      margin-right: 12px;
      white-space: nowrap;
      font-size: 1.02rem;
    }
    .input-wrap {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input, select {
      border: 1px solid #b8cef1;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    select {
      min-width: 100px;
      background: #fff;
    }
    .step-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .step-group input {
      width: 70px;
      text-align: right;
    }
    .btn-wrap button {
      padding: 4px 8px;
      font-size: 14px;
      line-height: 1;
      background: #fff;
      border: 1px solid #b8cef1;
      cursor: pointer;
    }
    /* ---------- 統計區 ---------- */
    .stat-area {
      margin: 28px 0 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .stat-row {
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .stat-row .win  { color: #e53b2d; }
    .stat-row .draw { color: #27a146; }
    .stat-row .lose { color: #2166d1; }
    .stat-info {
      font-size: 1.05rem;
      margin: 6px 0 10px;
    }
    .piebox {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 12px;
    }
    .piechart {
      width: 140px;
      height: 140px;
    }
    .pie-legend div {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1rem;
      margin-bottom: 4px;
    }
    .pie-legend span {
      display: inline-block;
      width: 16px; height: 16px;
      border-radius: 50%;
    }
    /* ---------- 表格 ---------- */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 20px;
    }
    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 1.05rem;
    }
    th, td {
      border: 1px solid #e5e5e5;
      padding: 8px 6px;
      text-align: center;
      word-wrap: break-word;
      white-space: normal;
    }
    th {
      background: #f2f6fb;
    }
    /* ---------- 手機響應 (優化後 v3) ---------- */
    @media (max-width: 768px) {
      .header h1 { font-size: 2rem; }
      .stat-row { font-size: 1.1rem; gap: 12px; }
      .piebox { flex-wrap: wrap; gap: 12px; }
      .piechart { width: 120px; height: 120px; }
      table { font-size: .85rem; }

      /* --- 表單同行排版邏輯 --- */
      .row {
        flex-wrap: nowrap;
        gap: 6px;
      }

      fieldset .row label {
        width: auto;
        text-align: left;
        margin-right: 0;
        flex-shrink: 0;
      }

        flex-wrap: nowrap;

        gap: 4px;
        min-width: 0;

      }

      }

      .input-wrap > span {
          flex-shrink: 0;
      }
      
      .step-group {

        align-items: center;
        flex-shrink: 0;
        gap: 4px;
      }

      .step-group input {
        width: 55px;
        flex-shrink: 0;
      }
      
      .btn-wrap button {
          padding: 4px 6px;
      }
    }
  
    #ahTable, #ouTable, #euTable {
      display: none;
    }

<style id="fx-3d-dynamic">
/* ========= FX 3D / Dynamic Pack ========= */
:root{
  --brand:#1666c1;
  --ink:#0ea5e9;
  --accent:#e53b2d;
  --ok:#27a146;
  --muted:#2166d1;
  --card-bg:#fff;
  --shadow-1: 0 3px 18px rgba(138,179,233,.16);
  --shadow-2: 0 10px 30px rgba(22,102,193,.18), 0 2px 6px rgba(0,0,0,.05);
}
.header{
  position: relative;
  background: linear-gradient(135deg,#1155ab 0%,#1a78db 40%,#16a1e6 100%);
  background-size: 300% 300%;
  animation: headerGrad 12s ease-in-out infinite;
  box-shadow: inset 0 -8px 20px rgba(0,0,0,.06);
}
.header h1{ text-shadow: 0 6px 18px rgba(0,0,0,.15); }
@keyframes headerGrad{
  0%{ background-position: 0% 50%; }
  50%{ background-position: 100% 50%; }
  100%{ background-position: 0% 50%; }
}
.tabbar{ position:relative; overflow:hidden; }
.tabbar button{ position:relative; }
.tab-ink{
  position:absolute; left:0; bottom:0;
  height:3px; width:0; border-radius:3px;
  background: linear-gradient(90deg,var(--ink),#60a5fa);
  box-shadow: 0 2px 10px rgba(14,165,233,.6);
  transition: transform .35s ease, width .35s ease, left .35s ease;
}
.tabcontent{
  transform-style: preserve-3d;
  transition: box-shadow .25s ease, transform .25s ease;
  box-shadow: var(--shadow-1);
  will-change: transform;
}
@media (pointer:fine){
  .tabcontent.fx-tilt:hover{
    box-shadow: var(--shadow-2);
  }
}
button.btn, .btn{
  position:relative; overflow:hidden; transform: translateZ(0);
  transition: transform .08s ease, box-shadow .2s ease !important;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}
button.btn:active, .btn:active{
  transform: translateY(1px);
}
.fx-ripple{
  position:absolute; border-radius:50%; pointer-events:none;
  inset:auto auto; width:10px; height:10px; opacity:.35;
  background:radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,255,255,.2) 60%, transparent 70%);
  transform: translate(-50%,-50%) scale(0);
  animation: ripple .6s ease-out forwards;
}
@keyframes ripple{
  to{ transform: translate(-50%,-50%) scale(18); opacity:0; }
}
#loadingOverlay{
  position:fixed; inset:0; display:none; align-items:center; justify-content:center;
  background:rgba(255,255,255,.92); z-index:9999; color:var(--brand);
  gap:14px; font-size:1.05rem;
}
.spinner3d{
  width:28px; height:28px; border-radius:50%;
  border:3px solid rgba(22,102,193,.18); border-top-color: var(--brand);
  animation: spin 1s linear infinite;
  box-shadow: 0 0 20px rgba(22,102,193,.25), inset 0 0 10px rgba(22,102,193,.1);
}
@keyframes spin{ to { transform: rotate(360deg); } }
.piechart{ filter: drop-shadow(0 6px 14px rgba(0,0,0,.12)); }
.piechart .slice{ transform-origin: 50% 50%; animation: piePop .55s cubic-bezier(.2,.7,.2,1) both; }
@keyframes piePop{ from{ transform: scale(.85); opacity:.2; } to{ transform: scale(1); opacity:1; } }
.reveal{ opacity:0; transform: translateY(12px); transition: opacity .5s ease, transform .5s ease; }
.reveal.in{ opacity:1; transform: none; }
.table-wrap table thead th{
  position:sticky; top:0; z-index:1; box-shadow: 0 2px 0 rgba(0,0,0,.04);
  background: #fff;
}
.table-wrap table tbody tr{ transition: background .2s ease, transform .2s ease; }
.table-wrap table tbody tr:hover{ background:#f8fbff; transform: translateZ(0); }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: 0ms !important; }
}
</style></head>

<th>賽季</th><th>比賽</th><th>初盤(主/和/客)</th><th>終盤(主/和/客)</th>
<th>比分</th><th>勝負</th><th>淨勝球</th>
</tr></thead>
<tbody></tbody>
</table>
</div>
</div>
<script>
    /***********************************************/
    /* 1. 全局變數與設定 (Global Variables & Config) */
    /***********************************************/
    // 統一宣告全局變數，用 null 初始化，表示資料未載入
    let AH = null, OU = null, EU = null;
    let lastAhResult = [], lastOuResult = [], lastEuResult = [];

    const DB = {
      asian:     { base: 'asian_handicap', subdir: '' },
      overUnder: { base: 'over_under',     subdir: '' },
      european:  { base: 'european_odds',  subdir: '' }
    };

    /***********************************************/
    /* 2. 核心功能與輔助函數 (Core & Helper Functions) */
    /***********************************************/

    /* ===== Loading Overlay Control ===== */
    const overlay = document.getElementById('loadingOverlay');
    const __showLoading = () => { if(overlay) overlay.style.display = 'flex'; };
    const __hideLoading = () => { if(overlay) overlay.style.display = 'none'; };
    
    /* ===== Tabs UI ===== */
    function showTab(i) {
      ["tab1", "tab2", "tab3"].forEach((id, idx) => {
        document.getElementById(id).classList.toggle("active", idx === i);
        document.getElementById("tc" + (idx + 1)).style.display = idx === i ? "block" : "none";
      });
    }

    /* ===== Form & Input Helpers ===== */
    function stepErr(id, delta) {
      const el = document.getElementById(id);
      let v = parseFloat(el.value) || 0;
      v = Math.max(0, +(v + delta).toFixed(2));
      el.value = v.toFixed(2);
    }

    function range(exId, erId) {
      const ex = parseFloat(document.getElementById(exId).value),
            er = parseFloat(document.getElementById(erId).value) || 0;
      return isNaN(ex) ? [null, null] : [ex - er, ex + er];
    }
    
    /* ===== Data Display Helpers ===== */
    function pct(n, t) {
      return t ? ((n / t * 100).toFixed(1) + '%') : '0.0%';
    }

    /* ===== Pie Chart Drawer ===== */
    function drawPieChart(data) {
      const total = data.reduce((s, x) => s + x.val, 0);
      if (!total) return '<svg class="piechart"></svg>';

      const sz = 140, r = sz / 2 - 5, cx = sz / 2, cy = sz / 2;
      const slices = data.filter(d => d.val > 0);

      if (slices.length === 1) {
        return `<svg class="piechart" viewBox="0 0 ${sz} ${sz}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${slices[0].color}"></circle></svg>`;
      }
      
      let currentAngle = -Math.PI / 2;
      const paths = slices.map(slice => {
        const sliceAngle = (slice.val / total) * 2 * Math.PI;
        const startAngle = currentAngle;
        const endAngle = currentAngle + sliceAngle;
        const x1 = cx + r * Math.cos(startAngle);
        const y1 = cy + r * Math.sin(startAngle);
        const x2 = cx + r * Math.cos(endAngle);
        const y2 = cy + r * Math.sin(endAngle);
        const largeArcFlag = sliceAngle > Math.PI ? 1 : 0;
        currentAngle = endAngle;
        return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArcFlag} 1 ${x2},${y2} Z" fill="${slice.color}"></path>`;
      }).join('');

      return `<svg class="piechart" viewBox="0 0 ${sz} ${sz}">${paths}</svg>`;
    }
    
    /* ===== EU Odds Compatibility Helper ===== */
    // 為歐洲盤提供欄位兼容性，可以讀取 EU_* 或 1X2_*
    function getEU(r, which) {
      const map = {
        open_home: ['EU_open_home_odds', '1X2_open_home_odds'],
        open_draw: ['EU_open_draw_odds', '1X2_open_draw_odds'],
        open_away: ['EU_open_away_odds', '1X2_open_away_odds'],
        close_home: ['EU_close_home_odds', '1X2_close_home_odds'],
        close_draw: ['EU_close_draw_odds', '1X2_close_draw_odds'],
        close_away: ['EU_close_away_odds', '1X2_close_away_odds'],
      };
      const keys = map[which] || [];
      for (const k of keys) { if (r[k] != null) return r[k]; }
      return null;
    }


    /***********************************************/
    /* 3. 資料載入邏輯 (Data Loading Logic)           */
    /***********************************************/

    /* ===== Trailing-number chunk loader ===== */
    async function loadWithTrailingNumbers(base, { subdir = '', maxParts = 10 } = {}) {
      const prefix = subdir ? (subdir.replace(/\/$/, '') + '/') : '';
      const urls = [`${prefix}${base}.json`];
      for (let i = 1; i <= maxParts; i++) { urls.push(`${prefix}${base}${i}.json`); }

      const results = await Promise.allSettled(
        urls.map(u => fetch(u, { cache: 'no-store' }).then(r => r.ok ? r.json() : null))
      );
      const merged = [];
      for (const r of results) {
        if (r.status === 'fulfilled' && Array.isArray(r.value)) merged.push(...r.value);
      }
      return merged;
    }

    /* ===== Datasets getters (lazy + cache) ===== */
    async function getAsianData(opts = {}) {
      if (!AH) AH = await loadWithTrailingNumbers(DB.asian.base, { subdir: DB.asian.subdir, ...opts });
      return AH;
    }
    async function getOverUnderData(opts = {}) {
      if (!OU) OU = await loadWithTrailingNumbers(DB.overUnder.base, { subdir: DB.overUnder.subdir, ...opts });
      return OU;
    }
    async function getEuropeanData(opts = {}) {
      if (!EU) EU = await loadWithTrailingNumbers(DB.european.base, { subdir: DB.european.subdir, ...opts });
      return EU;
    }

    /***********************************************/
    /* 4. 初始化與搜尋邏輯 (Initialization & Search) */
    /***********************************************/

    /* ===== Fill Select Options ===== */
    function fillSelect(id, set) {
      const arr = Array.from(set).filter(v => v != null).sort((a, b) => a - b);
      document.getElementById(id).innerHTML =
        '<option value="">--</option>' +
        arr.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function initAll() {
      // 確保資料已載入
      if (!AH || !OU || !EU) {
        console.error("Data not loaded yet!");
        return;
      }
      fillSelect('ahInitHand', new Set(AH.map(r => r.AH_open_handicap)));
      fillSelect('ahCloseHand', new Set(AH.map(r => r.AH_close_handicap)));
      fillSelect('ouInitLine', new Set(OU.map(r => r.OU_line)));
      fillSelect('ouCloseLine', new Set(OU.map(r => r.close_OU_line)));
    }
    
    /* ===== Search Functions ===== */
    function doAhSearch() {
      const [hMin, hMax] = range('ahHomeExact', 'ahHomeErr'),
            [aMin, aMax] = range('ahAwayExact', 'ahAwayErr'),
            [hMinC, hMaxC] = range('ahCloseHomeExact', 'ahCloseHomeErr'),
            [aMinC, aMaxC] = range('ahCloseAwayExact', 'ahCloseAwayErr'),
            selO = document.getElementById('ahInitHand').value,
            selC = document.getElementById('ahCloseHand').value;

      lastAhResult = AH.filter(r => {
        if (selO && r.AH_open_handicap != +selO) return false;
        if (selC && r.AH_close_handicap != +selC) return false;
        if (hMin !== null && (r.AH_open_home_odds < hMin || r.AH_open_home_odds > hMax)) return false;
        if (aMin !== null && (r.AH_open_away_odds < aMin || r.AH_open_away_odds > aMax)) return false;
        if (hMinC !== null && (r.AH_close_home_odds < hMinC || r.AH_close_home_odds > hMaxC)) return false;
        if (aMinC !== null && (r.AH_close_away_odds < aMinC || r.AH_close_away_odds > aMaxC)) return false;
        return true;
      });

      let w = 0, d = 0, l = 0;
      lastAhResult.forEach(r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs + r.AH_close_handicap - as;
        if (diff > 0) w++; else if (diff < 0) l++; else d++;
      });

      const tot = lastAhResult.length;
      document.getElementById('ahStat').innerHTML = `
        <div class="stat-row">
          <span class="win">贏盤 ${w} (${pct(w, tot)})</span>
          <span class="draw">和盤 ${d} (${pct(d, tot)})</span>
          <span class="lose">輸盤 ${l} (${pct(l, tot)})</span>
        </div>
        <div class="stat-info">總場數：${tot}</div>
        <div class="piebox">
          ${drawPieChart([{ label: '贏盤', val: w, color: '#e53b2d' }, { label: '和盤', val: d, color: '#27a146' }, { label: '輸盤', val: l, color: '#2166d1' }])}
          <div class="pie-legend">
            <div><span style="background:#e53b2d"></span>贏盤</div>
            <div><span style="background:#27a146"></span>和盤</div>
            <div><span style="background:#2166d1"></span>輸盤</div>
          </div>
        </div>`;
      
      document.getElementById('ahTable').style.display = 'none';
      document.getElementById('showAhListBtn').style.display = tot > 0 ? 'inline-block' : 'none';
    }

    function doOuSearch() {
      const selO = document.getElementById('ouInitLine').value,
            selC = document.getElementById('ouCloseLine').value;
      const [bMin, bMax] = range('ouBigExact', 'ouBigErr'),
            [sMin, sMax] = range('ouSmallExact', 'ouSmallErr'),
            [bMinC, bMaxC] = range('ouBigExactC', 'ouBigErrC'),
            [sMinC, sMaxC] = range('ouSmallExactC', 'ouSmallErrC');

      lastOuResult = OU.filter(r => {
        if (selO && r.OU_line != +selO) return false;
        if (selC && r.close_OU_line != +selC) return false;
        if (bMin !== null && (r.OU_open_over_odds < bMin || r.OU_open_over_odds > bMax)) return false;
        if (sMin !== null && (r.OU_open_under_odds < sMin || r.OU_open_under_odds > sMax)) return false;
        if (bMinC !== null && (r.OU_close_over_odds < bMinC || r.OU_close_over_odds > bMaxC)) return false;
        if (sMinC !== null && (r.OU_close_under_odds < sMinC || r.OU_close_under_odds > sMaxC)) return false;
        return true;
      });

      let over = 0, push = 0, under = 0;
      lastOuResult.forEach(r => {
        const sum = r.ft_score.split('-').reduce((a, b) => +a + +b, 0);
        if (sum > r.close_OU_line) over++;
        else if (sum < r.close_OU_line) under++;
        else push++;
      });

      const tot = lastOuResult.length;
      document.getElementById('ouStat').innerHTML = `
        <div class="stat-row">
          <span class="win">大球 ${over} (${pct(over, tot)})</span>
          <span class="draw">走盤 ${push} (${pct(push, tot)})</span>
          <span class="lose">小球 ${under} (${pct(under, tot)})</span>
        </div>
        <div class="stat-info">總場數：${tot}</div>
        <div class="piebox">
          ${drawPieChart([{ label: '大球', val: over, color: '#e53b2d' }, { label: '走盤', val: push, color: '#27a146' }, { label: '小球', val: under, color: '#2166d1' }])}
          <div class="pie-legend">
            <div><span style="background:#e53b2d"></span>大球</div>
            <div><span style="background:#27a146"></span>走盤</div>
            <div><span style="background:#2166d1"></span>小球</div>
          </div>
        </div>`;
      
      document.getElementById('ouTable').style.display = 'none';
      document.getElementById('showOuListBtn').style.display = tot > 0 ? 'inline-block' : 'none';
    }

    function doEuSearch() {
      const [hMin, hMax] = range('euHomeExact', 'euHomeErr'),
            [dMin, dMax] = range('euDrawExact', 'euDrawErr'),
            [aMin, aMax] = range('euAwayExact', 'euAwayErr'),
            [hMinC, hMaxC] = range('euHomeExactC', 'euHomeErrC'),
            [dMinC, dMaxC] = range('euDrawExactC', 'euDrawErrC'),
            [aMinC, aMaxC] = range('euAwayExactC', 'euAwayErrC');

      lastEuResult = EU.filter(r => {
        const oH = getEU(r, 'open_home'); if (hMin !== null && (oH < hMin || oH > hMax)) return false;
        const oD = getEU(r, 'open_draw'); if (dMin !== null && (oD < dMin || oD > dMax)) return false;
        const oA = getEU(r, 'open_away'); if (aMin !== null && (oA < aMin || oA > aMax)) return false;
        const cH = getEU(r, 'close_home'); if (hMinC !== null && (cH < hMinC || cH > hMaxC)) return false;
        const cD = getEU(r, 'close_draw'); if (dMinC !== null && (cD < dMinC || cD > dMaxC)) return false;
        const cA = getEU(r, 'close_away'); if (aMinC !== null && (cA < aMinC || cA > aMaxC)) return false;
        return true;
      });

      let w = 0, d = 0, l = 0, d1 = 0, d2 = 0, d3 = 0;
      lastEuResult.forEach(r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs - as;
        if (diff > 0) {
          w++;
          if (diff === 1) d1++; else if (diff === 2) d2++; else d3++;
        } else if (diff < 0) {
          l++;
        } else {
          d++;
        }
      });

      const tot = lastEuResult.length;
      document.getElementById('euStat').innerHTML = `
        <div class="stat-row">
          <span class="win">主勝 ${w} (${pct(w, tot)})</span>
          <span class="draw">和局 ${d} (${pct(d, tot)})</span>
          <span class="lose">客勝 ${l} (${pct(l, tot)})</span>
        </div>
        <div class="stat-info">
          總場數：${tot}<br>
          主勝淨勝球 ➜ 1球:${d1} | 2球:${d2} | 3+球:${d3}
        </div>
        <div class="piebox">
          ${drawPieChart([{ label: '主勝', val: w, color: '#e53b2d' }, { label: '和局', val: d, color: '#27a146' }, { label: '客勝', val: l, color: '#2166d1' }])}
          <div class="pie-legend">
            <div><span style="background:#e53b2d"></span>主勝</div>
            <div><span style="background:#27a146"></span>和局</div>
            <div><span style="background:#2166d1"></span>客勝</div>
          </div>
        </div>`;
        
      document.getElementById('euTable').style.display = 'none';
      document.getElementById('showEuListBtn').style.display = tot > 0 ? 'inline-block' : 'none';
    }

    /***********************************************/
    /* 5. 事件監聽 (Event Listeners)               */
    /***********************************************/
    
    /* ===== Render Table Listeners ===== */
    function confirmAndRender(resultArray, tableId, renderFn) {
      if (resultArray.length > 20000) {
        if (!confirm(`結果總共有 ${resultArray.length} 筆資料，全部顯示可能會導致頁面緩慢。確定要繼續嗎？`)) {
          return;
        }
      }
      const table = document.getElementById(tableId);
      const tbody = table.querySelector('tbody');
      tbody.innerHTML = '';
      resultArray.forEach(r => tbody.insertAdjacentHTML('beforeend', renderFn(r)));
      table.style.display = 'table';
    }

    document.getElementById('showAhListBtn').addEventListener('click', () => {
      confirmAndRender(lastAhResult, 'ahTable', r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs + r.AH_close_handicap - as;
        const out = diff > 0 ? '贏盤' : diff < 0 ? '輸盤' : '和盤';
        return `<tr>
          <td>${r.season}</td>
          <td>${r.home_team} vs ${r.away_team} (${r.ft_score})</td>
          <td>${r.AH_open_handicap}</td><td>${r.AH_open_home_odds}</td><td>${r.AH_open_away_odds}</td>
          <td>${r.AH_close_handicap}</td><td>${r.AH_close_home_odds}</td><td>${r.AH_close_away_odds}</td>
          <td>${out}</td>
        </tr>`;
      });
    });

    document.getElementById('showOuListBtn').addEventListener('click', () => {
      confirmAndRender(lastOuResult, 'ouTable', r => {
        const sum = r.ft_score.split('-').reduce((a, b) => +a + +b, 0);
        const out = sum > r.close_OU_line ? '大球' : sum < r.close_OU_line ? '小球' : '走盤';
        return `<tr>
          <td>${r.season}</td>
          <td>${r.home_team} vs ${r.away_team} (${r.ft_score})</td>
          <td>${r.OU_line}</td><td>${r.OU_open_over_odds}</td><td>${r.OU_open_under_odds}</td>
          <td>${r.close_OU_line}</td><td>${r.OU_close_over_odds}</td><td>${r.OU_close_under_odds}</td>
          <td>${out}</td>
        </tr>`;
      });
    });

    document.getElementById('showEuListBtn').addEventListener('click', () => {
      confirmAndRender(lastEuResult, 'euTable', r => {
        const [hs, as] = r.ft_score.split('-').map(Number);
        const diff = hs - as;
        const out = diff > 0 ? '主勝' : diff < 0 ? '客勝' : '和局';
        return `<tr>
          <td>${r.season}</td>
          <td>${r.home_team} vs ${r.away_team} (${r.ft_score})</td>
          <td>${getEU(r, 'open_home')}/${getEU(r, 'open_draw')}/${getEU(r, 'open_away')}</td>
          <td>${getEU(r, 'close_home')}/${getEU(r, 'close_draw')}/${getEU(r, 'close_away')}</td>
          <td>${r.ft_score}</td><td>${out}</td><td>${diff}</td>
        </tr>`;
      });
    });

    /* ===== Reset Button Listeners ===== */
    document.getElementById('resetAhBtn').addEventListener('click', () => {
      document.getElementById('ahForm').reset();
      document.getElementById('ahStat').innerHTML = '';
      document.getElementById('showAhListBtn').style.display = 'none';
      document.getElementById('ahTable').style.display = 'none';
      lastAhResult = [];
    });
    document.getElementById('resetOuBtn').addEventListener('click', () => {
      document.getElementById('ouForm').reset();
      document.getElementById('ouStat').innerHTML = '';
      document.getElementById('showOuListBtn').style.display = 'none';
      document.getElementById('ouTable').style.display = 'none';
      lastOuResult = [];
    });
    document.getElementById('resetEuBtn').addEventListener('click', () => {
      document.getElementById('euForm').reset();
      document.getElementById('euStat').innerHTML = '';
      document.getElementById('showEuListBtn').style.display = 'none';
      document.getElementById('euTable').style.display = 'none';
      lastEuResult = [];
    });

    /***********************************************/
    /* 6. 啟動函數 (Boot Function)                  */
    /***********************************************/
    (async function boot() {
      try {
        __showLoading();
        // 並行載入所有資料
        await Promise.all([
          getAsianData({ maxParts: 10 }),
          getOverUnderData({ maxParts: 10 }),
          getEuropeanData({ maxParts: 10 })
        ]);
        // 資料載入成功後，初始化頁面
        initAll();
      } catch (e) {
        console.error('資料載入失敗 (Data loading failed)', e);
        alert('資料載入失敗，請稍後再試。');
      } finally {
        __hideLoading();
      }
    })();
  </script><script id="fx-3d-dynamic-js">
/* ===================== FX 3D / Dynamic JS ===================== */
(function(){
  const prefersReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hasFinePointer = window.matchMedia('(pointer: fine)').matches;

  function updateInk(){
    const ink = document.getElementById('tabInk'); if(!ink) return;
    const tabs = [document.getElementById('tab1'), document.getElementById('tab2'), document.getElementById('tab3')].filter(Boolean);
    const active = tabs.find(b=>b.classList.contains('active')) || tabs[0];
    if(!active) return;
    const box = active.getBoundingClientRect();
    const wrap = active.parentElement.getBoundingClientRect();
    ink.style.width = box.width+'px';
    ink.style.left  = (box.left - wrap.left)+'px';
  }
  window.addEventListener('resize', updateInk);

  function enableTiltOn(el){
    if(!el || !hasFinePointer) return;
    const max = 6; const persp = 900;
    el.classList.add('fx-tilt');
    el.style.perspective = persp+'px';
    el.addEventListener('mousemove', e=>{
      if(prefersReduce) return;
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top)  / r.height;
      const rx = (0.5 - y) * max;
      const ry = (x - 0.5) * max;
      el.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    });
    el.addEventListener('mouseleave', ()=>{ el.style.transform = ''; });
  }

  function attachRipple(){
    document.addEventListener('click', e=>{
      const btn = e.target.closest('button, .btn');
      if(!btn) return;
      const ripple = document.createElement('span');
      ripple.className = 'fx-ripple';
      const rect = btn.getBoundingClientRect();
      ripple.style.left = (e.clientX - rect.left)+'px';
      ripple.style.top  = (e.clientY - rect.top)+'px';
      btn.appendChild(ripple);
      setTimeout(()=>ripple.remove(), 650);
    }, {passive:true});
  }

  function observeReveal(){
    const io = new IntersectionObserver(es=>{
      es.forEach(({isIntersecting, target})=>{
        if(isIntersecting){ target.classList.add('in'); io.unobserve(target); }
      });
    }, {threshold: .12});
    document.querySelectorAll('.stat-area, .table-wrap, fieldset, .timestamp, .tabcontent')
            .forEach(n=>{ n.classList.add('reveal'); io.observe(n); });
  }

  // Override drawPieChart if exists
  const overridePie = ()=>{
    const prev = window.drawPieChart;
    window.drawPieChart = function(data){
      const total = (data||[]).reduce((s,x)=>s + (x.val||0), 0);
      const sz=140, r=sz/2-5, cx=sz/2, cy=sz/2;
      if(!total) return `<svg class="piechart" width="${sz}" height="${sz}"></svg>`;
      let currentAngle = -Math.PI/2, idx=-1;
      const slices = data.filter(d=>(d.val||0)>0);
      const paths = slices.map(slice=>{
        idx++;
        const sliceAngle = (slice.val/total)*Math.PI*2;
        const start = currentAngle;
        const end   = currentAngle + sliceAngle;
        const x1 = cx + r*Math.cos(start), y1 = cy + r*Math.sin(start);
        const x2 = cx + r*Math.cos(end),   y2 = cy + r*Math.sin(end);
        const large = sliceAngle > Math.PI ? 1 : 0;
        currentAngle = end;
        return `<path class="slice" style="animation-delay:${idx*90}ms" d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${slice.color}" />`;
      }).join('');
      return `<svg class="piechart" viewBox="0 0 ${sz} ${sz}">
        <defs><filter id="ds"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/></filter></defs>
        <g filter="url(#ds)">${paths}</g>
      </svg>`;
    };
    // Keep a reference to restore if needed
    window._drawPieChart_prev = prev;
  };

  (function hookShowTab(){
    const tryHook = ()=>{
      if(typeof window.showTab !== 'function') return false;
      const _orig = window.showTab;
      if(_orig && _orig.__hooked) return true;
      const wrapped = function(i){
        _orig(i);
        updateInk();
        const panel = document.getElementById('tc'+(i+1));
        if(panel){ panel.classList.remove('in'); panel.classList.add('reveal'); requestAnimationFrame(()=>panel.classList.add('in')); }
      };
      wrapped.__hooked = true;
      window.showTab = wrapped;
      return true;
    };
    const ok = tryHook();
    if(!ok){
      // If not ready yet, try again after load
      window.addEventListener('load', tryHook);
    }
  })();

  function initFX(){
    updateInk();
    ['tc1','tc2','tc3'].forEach(id=> enableTiltOn(document.getElementById(id)));
    attachRipple();
    observeReveal();
    overridePie();
  }
  window.addEventListener('load', initFX);
})();
</script>
</body>
</html>
